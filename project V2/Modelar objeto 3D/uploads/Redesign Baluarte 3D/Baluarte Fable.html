document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

              <p style=\"margin:8px 0 0;color:var(--dim);font-size:13px;\">Exércitos, marinhas e forças aéreas dos países do mundo.<\u002Fp>\n                <\u002Fdiv>\n                <span data-cursor=\"1\" style=\"flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:7px 13px;cursor:none;white-space:nowrap;\" style-hover=\"background:var(--panel2)\">abrir página completa →<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:16px 0 0;color:var(--dim);font-size:13.5px;line-height:1.75;\"><span style=\"float:left;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:46px;line-height:.75;padding:6px 10px 0 2px;color:var(--accent);text-shadow:0 0 14px var(--glow);\">A<\u002Fspan>s forças armadas de uma nação constituem o conjunto das suas organizações e forças de combate e de defesa. Dependendo do país, as forças armadas podem adotar designações oficiais alternativas como \"forças de autodefesa\", \"forças militares\" ou \"exércitos\".<\u002Fp>\n              <div style=\"margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;\"><span style=\"color:var(--accent);\">Ler na Wikipédia →<\u002Fspan> <span style=\"color:var(--dim);\">FONTE: WIKIPÉDIA · CC BY-SA<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n\n    <!-- THEME SWITCHER -->\n    <div style=\"position:absolute;right:20px;bottom:18px;z-index:25;display:flex;align-items:center;gap:10px;padding:9px 13px;border:1px solid var(--line);border-radius:30px;background:rgba(16,12,24,0.8);backdrop-filter:blur(10px);\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:1.5px;color:var(--dim);\">TEMA<\u002Fspan>\n      <button data-cursor=\"1\" data-theme=\"ouro\" onclick=\"{{ setTheme }}\" title=\"Ouro de Fábula\" style=\"width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:none;background:linear-gradient(135deg,#d4a24e,#e8c07a);box-shadow:0 0 10px rgba(212,162,78,.6);\"><\u002Fbutton>\n      <button data-cursor=\"1\" data-theme=\"rubi\" onclick=\"{{ setTheme }}\" title=\"Rubi Encantado\" style=\"width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:none;background:linear-gradient(135deg,#c8556d,#e0a06d);box-shadow:0 0 10px rgba(200,85,109,.6);\"><\u002Fbutton>\n      <button data-cursor=\"1\" data-theme=\"esmeralda\" onclick=\"{{ setTheme }}\" title=\"Esmeralda Ancestral\" style=\"width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:none;background:linear-gradient(135deg,#2fbf8f,#8fd4b4);box-shadow:0 0 10px rgba(47,191,143,.6);\"><\u002Fbutton>\n    <\u002Fdiv>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cyan&quot;,&quot;crimson&quot;,&quot;void&quot;],&quot;default&quot;:&quot;cyan&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Estética&quot;},&quot;intensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.4,&quot;max&quot;:1.6,&quot;step&quot;:0.1,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;3D&quot;,&quot;unit&quot;:&quot;x&quot;}}\">\nconst THEMES = {\n  ouro: {\n    vars: {'--bg':'#0e0c16','--bg2':'#141020','--panel':'rgba(32,26,44,0.5)','--panel2':'rgba(42,34,58,0.66)','--line':'rgba(212,178,112,0.16)','--txt':'#f4ecdd','--dim':'#a89a80','--accent':'#d4a24e','--accent2':'#e8c07a','--glow':'rgba(212,162,78,0.45)'},\n    three: {core:0xd4a24e, particle:0xf0dcae, wire:0x9a7436}\n  },\n  esmeralda: {\n    vars: {'--bg':'#0a1210','--bg2':'#0e1a16','--panel':'rgba(20,40,34,0.5)','--panel2':'rgba(26,50,42,0.66)','--line':'rgba(110,200,160,0.16)','--txt':'#e9f5ee','--dim':'#8aa896','--accent':'#2fbf8f','--accent2':'#8fd4b4','--glow':'rgba(47,191,143,0.45)'},\n    three: {core:0x2fbf8f, particle:0xbfe8d4, wire:0x1e7a5c}\n  },\n  rubi: {\n    vars: {'--bg':'#140a0f','--bg2':'#1c0e14','--panel':'rgba(44,22,30,0.5)','--panel2':'rgba(56,28,38,0.66)','--line':'rgba(224,138,150,0.16)','--txt':'#f7ecec','--dim':'#af8d92','--accent':'#c8556d','--accent2':'#e0a06d','--glow':'rgba(200,85,109,0.45)'},\n    three: {core:0xc8556d, particle:0xf0c4cc, wire:0x8a3648}\n  }\n};\n\nclass Component extends DCLogic {\n  els = {};\n  rootRef = (el)=>{ if(el) this.els.root=el; };\n  sideRef = (el)=>{ if(el) this.els.side=el; };\n  canvasRef = (el)=>{ if(el) this.els.canvas=el; };\n  curRef = (el)=>{ if(el) this.els.cur=el; };\n  curDotRef = (el)=>{ if(el) this.els.curDot=el; };\n  eyebrowRef = (el)=>{ if(el) this.els.eyebrow=el; };\n  scrollRef = (el)=>{ if(el) this.els.scroll=el; };\n  bootRef = (el)=>{ if(el) this.els.boot=el; };\n  bootCanvasRef = (el)=>{ if(el) this.els.bootCanvas=el; };\n  wordRef = (el)=>{ if(el) this.els.word=el; };\n\n  state = { screen:'home', themeKey:'ouro', time:'--:--:--', dateStr:'', collapsed:false };\n\n  componentDidMount(){\n    const tk = (this.props.theme && THEMES[this.props.theme]) ? this.props.theme : 'ouro';\n    this.setState({ themeKey: tk });\n    this.applyTheme(tk);\n    this.startClock();\n    this.initCursor();\n    this.waitThree();\n    setTimeout(()=>this.scramble(), 250);\n    setTimeout(()=>this.countUp(), 400);\n    this.initBoot();\n  }\n\n  componentDidUpdate(prevProps, prevState){\n    prevProps=prevProps||{}; prevState=prevState||{};\n    if(prevState.themeKey !== this.state.themeKey) this.applyTheme(this.state.themeKey);\n    if(prevProps.theme !== this.props.theme && this.props.theme && THEMES[this.props.theme]){\n      this.setState({ themeKey: this.props.theme });\n    }\n    if(prevState.screen !== this.state.screen){\n      setTimeout(()=>this.countUp(), 50);\n    }\n  }\n\n  componentWillUnmount(){\n    cancelAnimationFrame(this._raf); cancelAnimationFrame(this._craf);\n    cancelAnimationFrame(this._bootRaf); clearInterval(this._decodeIv); clearTimeout(this._bootEndT);\n    clearInterval(this._clock);\n    window.removeEventListener('mousemove', this._mm);\n    window.removeEventListener('resize', this._rz);\n  }\n\n  /* ---------- THEME ---------- */\n  applyTheme(key){\n    const t = THEMES[key]; if(!t) return;\n    const r = this.els.root; if(r){ for(const k in t.vars) r.style.setProperty(k, t.vars[k]); }\n    if(this.threeMats) this.setThreeColors(t.three);\n    // active ring on swatches\n    if(r){ r.querySelectorAll('[data-theme]').forEach(b=>{\n      b.style.borderColor = (b.dataset.theme===key) ? '#ffffff' : 'transparent';\n      b.style.transform = (b.dataset.theme===key) ? 'scale(1.15)' : 'scale(1)';\n    });}\n  }\n\n  /* ---------- BOOT LOGO (cascata cybertroniana) ---------- */\n  initBoot(){\n    const boot=this.els.boot, cv=this.els.bootCanvas, word=this.els.word;\n    if(!boot||!cv||!word) return;\n    if(this._bootRaf) cancelAnimationFrame(this._bootRaf);\n    clearTimeout(this._bootEndT);\n    boot.style.display='flex'; boot.style.opacity='1'; boot.style.pointerEvents='auto';\n    const W=cv.width=boot.clientWidth, H=cv.height=boot.clientHeight;\n    const ctx=cv.getContext('2d');\n    ctx.fillStyle='rgba(14,12,22,1)'; ctx.fillRect(0,0,W,H);\n    // glifo procedural angular (estilo cybertron): tracos numa grade 3x3 + circulo ocasional\n    const drawGlyph=(x,y,s,seed,alpha)=>{\n      let r=seed>>>0; const rnd=()=>{ r=(r*1103515245+12345)>>>0; return (r>>>16)/65536; };\n      const g=[[0,0],[s/2,0],[s,0],[0,s/2],[s/2,s/2],[s,s/2],[0,s],[s/2,s],[s,s]];\n      ctx.beginPath();\n      const n=2+((seed>>3)%3);\n      for(let i=0;i<n;i++){\n        const a=g[(rnd()*9)|0], b=g[(rnd()*9)|0];\n        ctx.moveTo(x+a[0],y+a[1]); ctx.lineTo(x+b[0],y+b[1]);\n      }\n      ctx.globalAlpha=alpha; ctx.stroke();\n      if((seed%5)===0){ ctx.beginPath(); ctx.arc(x+s/2,y+s/2,s*0.22,0,7); ctx.stroke(); }\n      ctx.globalAlpha=1;\n    };\n    const CS=16, cols=Math.ceil(W/CS);\n    const drops=Array.from({length:cols},()=>({y:Math.random()*-H, v:2.5+Math.random()*4.5, seed:(Math.random()*1e9)|0}));\n    const accent=getComputedStyle(boot).getPropertyValue('--accent').trim()||'#d4a24e';\n    let alive=true;\n    const loop=()=>{\n      if(!alive) return;\n      ctx.fillStyle='rgba(14,12,22,0.16)'; ctx.fillRect(0,0,W,H);\n      ctx.strokeStyle=accent; ctx.lineWidth=1;\n      for(let i=0;i<cols;i++){\n        const d=drops[i];\n        d.y+=d.v; d.seed=(d.seed+1)|0;\n        drawGlyph(i*CS+2, d.y, CS-5, d.seed*2654435761, 0.85);\n        drawGlyph(i*CS+2, d.y-CS*1.4, CS-5, (d.seed-7)*2654435761, 0.35);\n        if(d.y>H+40){ d.y=Math.random()*-200; d.v=2.5+Math.random()*4.5; }\n      }\n      this._bootRaf=requestAnimationFrame(loop);\n    };\n    loop();\n    this._bootStop=()=>{ alive=false; cancelAnimationFrame(this._bootRaf); };\n    // wordmark: decodifica de glifos para BALUARTE\n    const FINAL='BALUARTE', GL='⏃⏚☊⎅⟒⎎☌⊑⟟⟊☍⌰⋔⋏⍜⌿⍀⌇⏁⎍⎐⍙⌖⊬⋉◬⌭⌮';\n    let step=0;\n    clearInterval(this._decodeIv);\n    this._decodeIv=setInterval(()=>{\n      let out='';\n      for(let i=0;i<FINAL.length;i++){\n        out += (i < step-2) ? FINAL[i] : GL[(Math.random()*GL.length)|0];\n      }\n      word.textContent=out; step+=0.5;\n      if(step-2>=FINAL.length){ word.textContent=FINAL; clearInterval(this._decodeIv); }\n    },70);\n    this._bootEndT=setTimeout(()=>this.endBoot(), 3600);\n  }\n  endBoot(){\n    const boot=this.els.boot; if(!boot) return;\n    clearTimeout(this._bootEndT); clearInterval(this._decodeIv);\n    boot.style.opacity='0'; boot.style.pointerEvents='none';\n    setTimeout(()=>{ boot.style.display='none'; if(this._bootStop) this._bootStop(); }, 950);\n  }\n  replayBoot(){ this.initBoot(); }\n\n  /* ---------- CLOCK ---------- */\n  startClock(){\n    const days=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];\n    const mon=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];\n    const tick=()=>{\n      const d=new Date();\n      const p=n=>String(n).padStart(2,'0');\n      const time=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;\n      const date=`${days[d.getDay()]}, ${d.getDate()} DE ${mon[d.getMonth()]}.`;\n      const root=this.els.root; if(!root) return;\n      root.querySelectorAll('[data-clock=\"time\"]').forEach(e=>e.textContent=time);\n      root.querySelectorAll('[data-clock=\"date\"]').forEach(e=>e.textContent=date);\n    };\n    tick(); this._clock=setInterval(tick,1000);\n  }\n\n  /* ---------- CURSOR ---------- */\n  initCursor(){\n    let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my;\n    this._mm=(e)=>{\n      mx=e.clientX;my=e.clientY;\n      const dot=this.els.curDot; if(dot){dot.style.left=mx+'px';dot.style.top=my+'px';}\n      const hov=e.target.closest&&e.target.closest('[data-cursor]');\n      const ring=this.els.cur;\n      if(ring){\n        if(hov){ring.style.width='52px';ring.style.height='52px';ring.style.background='var(--glow)';ring.style.borderColor='transparent';}\n        else{ring.style.width='30px';ring.style.height='30px';ring.style.background='transparent';ring.style.borderColor='var(--accent)';}\n      }\n    };\n    window.addEventListener('mousemove',this._mm);\n    const loop=()=>{\n      cx+=(mx-cx)*0.18; cy+=(my-cy)*0.18;\n      const ring=this.els.cur; if(ring){ring.style.left=cx+'px';ring.style.top=cy+'px';}\n      this._craf=requestAnimationFrame(loop);\n    };\n    loop();\n  }\n\n  /* ---------- SCRAMBLE ---------- */\n  scramble(){\n    const el=this.els.eyebrow; if(!el) return;\n    const final=el.textContent; const chars='✦✧∴·※ABEFH0123456789';\n    let frame=0; const total=final.length;\n    const run=()=>{\n      let out='';\n      for(let i=0;i<total;i++){\n        if(i < frame*0.6) out+=final[i];\n        else if(final[i]===' ') out+=' ';\n        else out+=chars[(Math.random()*chars.length)|0];\n      }\n      el.textContent=out; frame++;\n      if(frame*0.6 < total+2) setTimeout(run,32); else el.textContent=final;\n    };\n    run();\n  }\n\n  /* ---------- COUNT UP ---------- */\n  countUp(){\n    const r=this.els.root; if(!r) return;\n    r.querySelectorAll('[data-count]').forEach(el=>{\n      const target=+el.dataset.count; const dur=1100; const t0=performance.now();\n      const step=(now)=>{\n        const p=Math.min(1,(now-t0)/dur); const e=1-Math.pow(1-p,3);\n        el.textContent=Math.round(target*e);\n        if(p<1) requestAnimationFrame(step); else el.textContent=target;\n      };\n      requestAnimationFrame(step);\n    });\n  }\n\n  /* ---------- TILT ---------- */\n  onTilt(e){\n    const c=e.currentTarget; const r=c.getBoundingClientRect();\n    const px=(e.clientX-r.left)/r.width-0.5, py=(e.clientY-r.top)/r.height-0.5;\n    c.style.transform=`perspective(900px) rotateX(${-py*5}deg) rotateY(${px*5}deg) translateZ(6px)`;\n    c.style.boxShadow=`0 18px 50px -20px var(--glow)`;\n  }\n  offTilt(e){\n    const c=e.currentTarget;\n    c.style.transform='perspective(900px) rotateX(0) rotateY(0)';\n    c.style.boxShadow='none';\n  }\n\n  /* ---------- NAV ---------- */\n  navClick(e){\n    const s=e.currentTarget.dataset.screen;\n    if(s) this.turnPage(s);\n  }\n  goHome(){ this.turnPage('home'); }\n  turnPage(s){\n    if(this._turning || s===this.state.screen) return;\n    const sc=this.els.scroll;\n    if(!sc){ this.setState({screen:s}); return; }\n    this._turning=true;\n    sc.style.transformOrigin='left center';\n    sc.style.transition='transform .38s cubic-bezier(.6,.05,.9,.4), opacity .38s ease-in';\n    sc.style.transform='perspective(1600px) rotateY(-26deg) translateX(-46px)';\n    sc.style.opacity='0';\n    setTimeout(()=>{\n      this.setState({screen:s}); sc.scrollTop=0;\n      sc.style.transition='none';\n      sc.style.transformOrigin='right center';\n      sc.style.transform='perspective(1600px) rotateY(20deg) translateX(36px)';\n      requestAnimationFrame(()=>requestAnimationFrame(()=>{\n        sc.style.transition='transform .5s cubic-bezier(.2,.85,.3,1), opacity .5s ease-out';\n        sc.style.transform='none';\n        sc.style.opacity='1';\n        setTimeout(()=>{ this._turning=false; sc.style.transition='none'; },520);\n      }));\n    },390);\n  }\n  setTheme(e){ const k=e.currentTarget.dataset.theme; this.setState({themeKey:k}); this.applyTheme(k); }\n  toggleSide(){\n    const s=this.els.side; if(!s) return;\n    this._col=!this._col;\n    s.style.width=this._col?'72px':'250px';\n    s.style.flexBasis=this._col?'72px':'250px';\n    s.querySelectorAll('[data-sidetext]').forEach(e=>{ e.style.display=this._col?'none':''; });\n  }\n\n  /* ---------- THREE ---------- */\n  waitThree(){\n    if(window.THREE){ this.initThree(); return; }\n    // The host runtime provides THREE globally. Poll for it; inject ONLY as a last resort\n    // after a long wait, so we never create a second instance.\n    let waited=0;\n    const poll=setInterval(()=>{\n      waited+=80;\n      if(window.THREE){ clearInterval(poll); if(!this._three) this.initThree(); return; }\n      if(waited>=4000){ clearInterval(poll); this.loadThree(); }\n    },80);\n  }\n  loadThree(){\n    if(window.THREE){ if(!this._three) this.initThree(); return; }\n    if(window.__threeInjected) return;\n    window.__threeInjected=true;\n    const s=document.createElement('script');\n    s.src='https://unpkg.com/three@0.128.0/build/three.min.js';\n    s.onload=()=>{ if(window.THREE && !this._three) this.initThree(); };\n    document.head.appendChild(s);\n  }\n  initThree(){\n    const THREE=window.THREE; const canvas=this.els.canvas; if(!canvas) return;\n    const main=canvas.parentElement;\n    const w=main.clientWidth, h=main.clientHeight;\n    const sc=new THREE.Scene();\n    sc.fog=new THREE.FogExp2(0x0e0c16,0.055);\n    const cam=new THREE.PerspectiveCamera(55,w/h,0.1,100); cam.position.set(0,0,9);\n    const rend=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});\n    rend.setPixelRatio(Math.min(devicePixelRatio,2)); rend.setSize(w,h);\n    const t=THEMES[this.state.themeKey].three;\n    const intensity = (this.props.intensity!=null)?this.props.intensity:1;\n\n    const grp=new THREE.Group(); sc.add(grp);\n\n    // core icosa solid glow\n    const coreGeo=new THREE.IcosahedronGeometry(1.5,1);\n    const coreMat=new THREE.MeshBasicMaterial({color:t.core,transparent:true,opacity:0.12,blending:THREE.AdditiveBlending});\n    const core=new THREE.Mesh(coreGeo,coreMat); grp.add(core);\n    // wireframe outer\n    const wireGeo=new THREE.IcosahedronGeometry(2.05,1);\n    const wireMat=new THREE.MeshBasicMaterial({color:t.wire,wireframe:true,transparent:true,opacity:0.32});\n    const wire=new THREE.Mesh(wireGeo,wireMat); grp.add(wire);\n    // edges of core\n    const edgeMat=new THREE.LineBasicMaterial({color:t.core,transparent:true,opacity:0.85});\n    const edges=new THREE.LineSegments(new THREE.EdgesGeometry(coreGeo),edgeMat); grp.add(edges);\n    // rings\n    const rings=[];\n    for(let i=0;i<3;i++){\n      const rg=new THREE.Mesh(new THREE.TorusGeometry(2.7+i*0.45,0.012,8,120),\n        new THREE.MeshBasicMaterial({color:i%2?t.wire:t.core,transparent:true,opacity:0.4-i*0.08}));\n      rg.rotation.x=Math.PI/2.4+i*0.5; rg.rotation.y=i*0.7; grp.add(rg); rings.push(rg);\n    }\n    // grand astrolabe halo\n    const halo=new THREE.Mesh(new THREE.TorusGeometry(4.4,0.007,8,180),\n      new THREE.MeshBasicMaterial({color:t.wire,transparent:true,opacity:0.22}));\n    halo.rotation.x=Math.PI/2.15; grp.add(halo); rings.push(halo);\n    // particle field\n    const cnt=Math.round(1500*intensity);\n    const pos=new Float32Array(cnt*3);\n    for(let i=0;i<cnt;i++){\n      const r=4+Math.random()*16, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);\n      pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);\n    }\n    const pGeo=new THREE.BufferGeometry(); pGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));\n    const pMat=new THREE.PointsMaterial({color:t.particle,size:0.05*intensity,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false});\n    const pts=new THREE.Points(pGeo,pMat); sc.add(pts);\n    // golden fireflies (twinkling)\n    const fCnt=Math.round(80*intensity);\n    const fPos=new Float32Array(fCnt*3);\n    for(let i=0;i<fCnt;i++){\n      const r=3+Math.random()*9, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);\n      fPos[i*3]=r*Math.sin(ph)*Math.cos(th); fPos[i*3+1]=r*Math.sin(ph)*Math.sin(th)*0.65; fPos[i*3+2]=r*Math.cos(ph);\n    }\n    const fGeo=new THREE.BufferGeometry(); fGeo.setAttribute('position',new THREE.BufferAttribute(fPos,3));\n    const fMat=new THREE.PointsMaterial({color:t.particle,size:0.14,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false});\n    const flies=new THREE.Points(fGeo,fMat); sc.add(flies);\n    // small floating shards\n    const shards=new THREE.Group(); sc.add(shards);\n    for(let i=0;i<14;i++){\n      const s=new THREE.Mesh(new THREE.TetrahedronGeometry(0.12+Math.random()*0.18),\n        new THREE.MeshBasicMaterial({color:t.core,transparent:true,opacity:0.5,wireframe:true}));\n      s.position.set((Math.random()-0.5)*12,(Math.random()-0.5)*8,(Math.random()-0.5)*6);\n      shards.add(s);\n    }\n\n    this.threeMats={coreMat,wireMat,edgeMat,pMat,fMat,rings,shards};\n    this._three={sc,cam,rend,grp,pts,shards};\n\n    let tx=0,ty=0,cmx=0,cmy=0;\n    const mh=(e)=>{ tx=(e.clientX/innerWidth-0.5); ty=(e.clientY/innerHeight-0.5); };\n    window.addEventListener('mousemove',mh);\n    this._rz=()=>{ const W=main.clientWidth,H=main.clientHeight; cam.aspect=W/H; cam.updateProjectionMatrix(); rend.setSize(W,H); };\n    window.addEventListener('resize',this._rz);\n\n    const clock=new THREE.Clock();\n    const animate=()=>{\n      const dt=clock.getDelta(), et=clock.getElapsedTime();\n      cmx+=(tx-cmx)*0.04; cmy+=(ty-cmy)*0.04;\n      grp.rotation.y+=dt*0.09; grp.rotation.x=Math.sin(et*0.15)*0.18+cmy*0.4;\n      grp.rotation.z+=dt*0.02;\n      grp.position.x=cmx*1.2; grp.position.y=-cmy*0.8;\n      wire.rotation.y-=dt*0.18; wire.rotation.x+=dt*0.05;\n      rings.forEach((r,i)=>{ r.rotation.z+=dt*(0.2+i*0.12); });\n      core.scale.setScalar(1+Math.sin(et*1.4)*0.04);\n      pts.rotation.y+=dt*0.015; pts.position.x=cmx*0.6; pts.position.y=-cmy*0.5;\n      flies.rotation.y-=dt*0.012; fMat.opacity=0.32+0.22*Math.sin(et*1.3)+0.08*Math.sin(et*3.7);\n      shards.children.forEach((s,i)=>{ s.rotation.x+=dt*0.4; s.rotation.y+=dt*0.3; s.position.y+=Math.sin(et+i)*0.002; });\n      cam.lookAt(0,0,0);\n      rend.render(sc,cam);\n      this._raf=requestAnimationFrame(animate);\n    };\n    animate();\n  }\n  setThreeColors(t){\n    const m=this.threeMats; if(!m) return;\n    m.coreMat.color.setHex(t.core); m.edgeMat.color.setHex(t.core);\n    m.wireMat.color.setHex(t.wire); m.pMat.color.setHex(t.particle);\n    m.fMat.color.setHex(t.particle);\n    m.rings.forEach((r,i)=> r.material.color.setHex(i%2?t.wire:t.core));\n    m.shards.children.forEach(s=> s.material.color.setHex(t.core));\n  }\n\n  renderVals(){\n    return {\n      rootRef:this.rootRef, sideRef:this.sideRef, canvasRef:this.canvasRef,\n      bootRef:this.bootRef, bootCanvasRef:this.bootCanvasRef, wordRef:this.wordRef,\n      skipBoot:()=>this.endBoot(), replayBoot:()=>this.replayBoot(),\n      curRef:this.curRef, curDotRef:this.curDotRef, eyebrowRef:this.eyebrowRef, scrollRef:this.scrollRef,\n      time:this.state.time, dateStr:this.state.dateStr,\n      isHome:this.state.screen==='home', isMil:this.state.screen==='militar',\n      navClick:(e)=>this.navClick(e), goHome:()=>this.goHome(), setTheme:(e)=>this.setTheme(e),\n      onTilt:(e)=>this.onTilt(e), offTilt:(e)=>this.offTilt(
