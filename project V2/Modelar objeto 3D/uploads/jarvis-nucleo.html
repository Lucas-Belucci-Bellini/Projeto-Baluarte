<style>
  :root{
    --gold:#f0b64a; --gold-soft:#ffd98a; --amber:#ff9d2e; --dim:#8a7a52; --bg:#04050a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:ui-monospace,'Courier New',monospace;cursor:crosshair;}
  #stage{position:fixed;inset:0}
  canvas{display:block}

  /* moldura HUD */
  .hud{position:fixed;z-index:5;color:var(--gold);pointer-events:none;
    text-transform:uppercase;letter-spacing:3px;text-shadow:0 0 14px rgba(240,182,74,.55);}
  #title{top:30px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:13px}
  #title b{font-size:clamp(20px,4vw,30px);letter-spacing:14px;display:block;margin-top:6px;color:var(--gold-soft)}
  #sub{color:var(--dim);font-size:9px;letter-spacing:6px;margin-top:7px}

  .corner{position:fixed;z-index:5;width:clamp(38px,6vw,64px);height:clamp(38px,6vw,64px);
    border-color:var(--gold);opacity:.6;pointer-events:none}
  .tl{top:22px;left:22px;border-top:2px solid;border-left:2px solid}
  .tr{top:22px;right:22px;border-top:2px solid;border-right:2px solid}
  .bl{bottom:22px;left:22px;border-bottom:2px solid;border-left:2px solid}
  .br{bottom:22px;right:22px;border-bottom:2px solid;border-right:2px solid}

  #readout{bottom:40px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:4px;
    display:flex;gap:clamp(14px,4vw,34px);justify-content:center;flex-wrap:wrap;padding:0 20px}
  #readout .k{color:var(--dim)} #readout .v{color:var(--gold-soft)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5cf08a;
    box-shadow:0 0 10px #5cf08a;margin-right:7px;vertical-align:middle;animation:blink 2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

  /* barra de ações (interativa) */
  #actions{position:fixed;z-index:6;top:24px;right:22px;display:flex;gap:10px;
    flex-direction:column;align-items:flex-end}
  .btn{pointer-events:auto;cursor:pointer;background:rgba(240,182,74,.08);
    border:1px solid rgba(240,182,74,.5);color:var(--gold-soft);
    font-family:inherit;font-size:10px;letter-spacing:2px;text-transform:uppercase;
    padding:9px 14px;border-radius:3px;text-shadow:0 0 8px rgba(240,182,74,.5);
    transition:background .2s,box-shadow .2s;backdrop-filter:blur(4px)}
  .btn:hover{background:rgba(240,182,74,.18);box-shadow:0 0 18px rgba(240,182,74,.35)}

  #loading{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--gold);font-size:11px;letter-spacing:6px;transition:opacity .8s}
  #err{position:fixed;left:0;right:0;bottom:70px;z-index:8;text-align:center;color:#ff6a6a;
    font-size:10px;letter-spacing:2px;display:none}
</style>

<body>
  <div id="stage"></div>

  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <div id="title" class="hud">núcleo online
    <b>J·A·R·V·I·S</b>
    <div id="sub">Mark XIII · Infinity Dreadnought · Projeto Baluarte</div>
  </div>

  <div id="actions">
    <button class="btn" id="dlBtn">▼ baixar .html</button>
    <button class="btn" id="glitchBtn">⚡ pulso de dados</button>
  </div>

  <div id="readout" class="hud">
    <span><span class="dot"></span><span class="v">rede neural</span> <span class="k">ativa</span></span>
    <span><span class="k">energia</span> <span class="v" id="pwr">98%</span></span>
    <span><span class="k">partículas</span> <span class="v" id="pcount">—</span></span>
    <span><span class="k">sinapses</span> <span class="v" id="links">—</span></span>
  </div>

  <div id="loading">INICIALIZANDO NÚCLEO…</div>
  <div id="err"></div>

<script>
/* ======================================================================
   NÚCLEO J.A.R.V.I.S. — Vanilla JS (init / animate / resize)
   ► AFINE TUDO NO OBJETO "CFG" ABAIXO ◄
   ====================================================================== */
const CFG = {
  // cores (hex 0x......)
  cCore:      0xffcf7a,  // núcleo quântico (micropartículas)
  cRings:     0xf0a83c,  // anéis de dados
  cRingAlt:   0xffb347,  // anéis alternados / nós
  cConstel:   0xffd98a,  // constelação neural
  cAmber:     0xff8c1a,  // acento quente / poeira
  bg:         0x04050a,

  // rotação (rad/s)
  spinCore:   0.10,
  spinRings:  0.5,
  spinDust:   0.03,

  // partículas (baixe se o desempenho cair)
  coreDetail: 4,     // subdivisão do icosaedro do núcleo (3=642, 4=2562, 5=10242 pts)
  ringCount:  6,     // nº de anéis concêntricos
  constelPts: 150,   // nós da rede neural
  dustCount:  1600,  // poeira de fundo

  // núcleo procedural (Simplex noise)
  noiseFreq:  1.5,   // frequência do ruído (detalhe da turbulência)
  noiseAmp:   0.42,  // amplitude da deformação
  noiseSpeed: 0.35,  // velocidade da turbulência
  pulseSpeed: 1.3,   // pulsação de energia
  pulseAmt:   0.14,

  // pós-processamento
  bloomStrength: 0.6,
  bloomRadius:   0.5,
  bloomThreshold:0.32,

  // interação
  parallax:    0.4,   // reação da câmara ao rato
  repelRadius: 2.6,   // raio de repulsão magnética do cursor
  repelForce:  1.6,   // força da repulsão
};

const T = window.THREE;
const J = { }; // namespace do núcleo (init/animate/resize)

/* ---- estado global ---- */
let scene, camera, renderer, composer, bloomPass, glitchPass;
let coreGroup, corePoints, coreBase, coreNormals, simplex;
let rings = [];
let constel, constelBase, constelVel, linkGeo, linkMat;
let dust;
const mouse = new T.Vector2(-999,-999);          // px do rato
const mouseWorld = new T.Vector3();               // rato projetado no plano z=0
const target = { x:0, y:0 }, cur = { x:0, y:0 };  // parallax
const clock = new T.Clock();
let linkCount = 0;

/* ====================================================================== */
/* INIT                                                                   */
/* ====================================================================== */
J.init = function(){
  const stage = document.getElementById('stage');

  scene = new T.Scene();
  scene.fog = new T.FogExp2(CFG.bg, 0.035);

  camera = new T.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
  camera.position.set(0, 0, 14);

  renderer = new T.WebGLRenderer({ antialias:true, alpha:false, preserveDrawingBuffer:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(CFG.bg, 1);
  stage.appendChild(renderer.domElement);

  simplex = new T.SimplexNoise();
  coreGroup = new T.Group(); scene.add(coreGroup);

  buildCore();
  buildRings();
  buildConstellation();
  buildDust();
  setupPostFX();
  bindEvents();

  document.getElementById('pcount').textContent =
    (coreBase.length/3 | 0).toLocaleString('pt-BR');

  // esconde ecrã de carregamento
  const ld = document.getElementById('loading');
  ld.style.opacity = '0'; setTimeout(()=>ld.remove(), 800);
};

/* ---------------------------------------------------------------------- */
/* 1. NÚCLEO QUÂNTICO — micropartículas numa esfera, deformadas por noise  */
/*    ShaderMaterial custom: pontos redondos + fade de opacidade por dist. */
/* ---------------------------------------------------------------------- */
function buildCore(){
  const geo = new T.IcosahedronGeometry(2.0, CFG.coreDetail);
  coreBase = Float32Array.from(geo.attributes.position.array); // posições de repouso
  // normais unitárias (direção em que cada vértice "respira")
  coreNormals = new Float32Array(coreBase.length);
  for(let i=0;i<coreBase.length;i+=3){
    const v = new T.Vector3(coreBase[i],coreBase[i+1],coreBase[i+2]).normalize();
    coreNormals[i]=v.x; coreNormals[i+1]=v.y; coreNormals[i+2]=v.z;
  }
  const pGeo = new T.BufferGeometry();
  pGeo.setAttribute('position', new T.BufferAttribute(Float32Array.from(coreBase),3));

  const mat = new T.ShaderMaterial({
    uniforms:{
      uColor:{ value:new T.Color(CFG.cCore) },
      uSize:{ value: 3.4 },
      uPixel:{ value: Math.min(devicePixelRatio,2) },
      uFadeNear:{ value: 4.0 },
      uFadeFar:{ value: 22.0 },
    },
    transparent:true, depthWrite:false, blending:T.AdditiveBlending,
    vertexShader:`
      uniform float uSize; uniform float uPixel;
      varying float vDist;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        vDist = -mv.z;
        gl_PointSize = uSize * uPixel * (60.0 / vDist);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader:`
      uniform vec3 uColor; uniform float uFadeNear; uniform float uFadeFar;
      varying float vDist;
      void main(){
        vec2 c = gl_PointCoord - 0.5;
        float d = length(c);
        if(d > 0.5) discard;                       // ponto redondo
        float core = smoothstep(0.5, 0.0, d);      // suavização da borda
        float fade = smoothstep(uFadeFar, uFadeNear, vDist); // some com a distância
        gl_FragColor = vec4(uColor, core * fade * 0.5);
      }`
  });
  corePoints = new T.Points(pGeo, mat);
  coreGroup.add(corePoints);

  // núcleo interior sutil (brilho central discreto) — alimenta o bloom sem estourar
  const heart = new T.Mesh(new T.SphereGeometry(0.42, 20, 20),
    new T.MeshBasicMaterial({ color:CFG.cRingAlt, transparent:true, opacity:0.12,
      blending:T.AdditiveBlending, depthWrite:false }));
  heart.name = 'heart';
  coreGroup.add(heart);
}

/* ---------------------------------------------------------------------- */
/* 2. ANÉIS DE DADOS — 6 camadas com detalhe sci-fi                        */
/* ---------------------------------------------------------------------- */
function makeCircleLine(radius, segments){
  const pts=[];
  for(let i=0;i<=segments;i++){ const a=i/segments*Math.PI*2;
    pts.push(new T.Vector3(Math.cos(a)*radius, Math.sin(a)*radius, 0)); }
  return new T.BufferGeometry().setFromPoints(pts);
}
function buildRings(){
  for(let i=0;i<CFG.ringCount;i++){
    const g = new T.Group();
    const R = 3.2 + i*0.62;
    const col = i%2 ? CFG.cRingAlt : CFG.cRings;

    // circunferência tracejada
    const dash = new T.Line(makeCircleLine(R,220),
      new T.LineDashedMaterial({ color:col, transparent:true, opacity:0.5-i*0.03,
        dashSize: 0.12 + (i%3)*0.1, gapSize: 0.06 + (i%2)*0.12, blending:T.AdditiveBlending }));
    dash.computeLineDistances(); g.add(dash);

    // marcas de ângulo radiais (mostrador)
    const marks = i%2===0 ? 72 : 48, mv=[];
    for(let k=0;k<marks;k++){ const a=k/marks*Math.PI*2;
      const inner = (k%6===0)? R-0.22 : R-0.09;
      mv.push(Math.cos(a)*inner, Math.sin(a)*inner, 0, Math.cos(a)*R, Math.sin(a)*R, 0); }
    const mg = new T.BufferGeometry();
    mg.setAttribute('position', new T.Float32BufferAttribute(mv,3));
    g.add(new T.LineSegments(mg, new T.LineBasicMaterial({ color:col,
      transparent:true, opacity:0.35, blending:T.AdditiveBlending })));

    // nós de conexão (pontos brilhantes ao longo do anel) + vetores
    const nodes = 3 + (i%4), nv=[], vv=[];
    for(let k=0;k<nodes;k++){ const a=(k/nodes)*Math.PI*2 + i;
      const x=Math.cos(a)*R, y=Math.sin(a)*R;
      nv.push(x,y,0);
      // vetor curto apontando para fora (marcador tático)
      vv.push(x,y,0, Math.cos(a)*(R+0.3), Math.sin(a)*(R+0.3), 0);
    }
    const ng=new T.BufferGeometry(); ng.setAttribute('position', new T.Float32BufferAttribute(nv,3));
    g.add(new T.Points(ng, new T.PointsMaterial({ color:CFG.cRingAlt, size:0.14,
      transparent:true, opacity:0.95, blending:T.AdditiveBlending, depthWrite:false })));
    const vg=new T.BufferGeometry(); vg.setAttribute('position', new T.Float32BufferAttribute(vv,3));
    g.add(new T.LineSegments(vg, new T.LineBasicMaterial({ color:CFG.cRingAlt,
      transparent:true, opacity:0.7, blending:T.AdditiveBlending })));

    // orientação inicial variada + eixo/velocidade de rotação próprios
    g.rotation.x = Math.PI*(0.1 + i*0.16);
    g.rotation.y = Math.PI*(i*0.21);
    g.userData.spin = {
      x:(Math.random()-0.5)*CFG.spinRings,
      y:(Math.random()-0.5)*CFG.spinRings,
      z:(0.3+Math.random()*0.6)*CFG.spinRings*(i%2?1:-1),
    };
    coreGroup.add(g); rings.push(g);
  }
}

/* ---------------------------------------------------------------------- */
/* 3. CONSTELAÇÃO NEURAL — nós flutuantes ligados por sinapses dinâmicas    */
/*    (as linhas acendem/apagam simulando processamento em tempo real)     */
/* ---------------------------------------------------------------------- */
function buildConstellation(){
  const n = CFG.constelPts;
  constelBase = new Float32Array(n*3);
  const cur = new Float32Array(n*3);
  constelVel = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    // casca esférica larga à volta do núcleo
    const r = 5.5 + Math.random()*4.5, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    const x=r*Math.sin(ph)*Math.cos(th), y=r*Math.sin(ph)*Math.sin(th)*0.8, z=r*Math.cos(ph);
    constelBase[i*3]=x; constelBase[i*3+1]=y; constelBase[i*3+2]=z;
    cur[i*3]=x; cur[i*3+1]=y; cur[i*3+2]=z;
  }
  const pg = new T.BufferGeometry();
  pg.setAttribute('position', new T.BufferAttribute(cur,3));
  constel = new T.Points(pg, new T.PointsMaterial({ color:CFG.cConstel, size:0.12,
    transparent:true, opacity:0.9, blending:T.AdditiveBlending, depthWrite:false }));
  scene.add(constel);

  // buffer de linhas (sinapses) — pré-alocado; nº atualizado por frame
  const maxLinks = n*6;
  linkGeo = new T.BufferGeometry();
  linkGeo.setAttribute('position', new T.BufferAttribute(new Float32Array(maxLinks*6),3));
  linkGeo.setAttribute('color',    new T.BufferAttribute(new Float32Array(maxLinks*6),3));
  linkMat = new T.LineBasicMaterial({ vertexColors:true, transparent:true,
    opacity:0.9, blending:T.AdditiveBlending, depthWrite:false });
  scene.add(new T.LineSegments(linkGeo, linkMat));
}

// recalcula as sinapses (chamado a cada frame)
function updateLinks(t){
  const pos = constel.geometry.attributes.position.array;
  const lp = linkGeo.attributes.position.array;
  const lc = linkGeo.attributes.color.array;
  const n = CFG.constelPts, maxD = 2.9, base = new T.Color(CFG.cConstel);
  let li = 0, ci = 0; linkCount = 0;
  for(let i=0;i<n;i++){
    for(let j=i+1;j<n;j++){
      const dx=pos[i*3]-pos[j*3], dy=pos[i*3+1]-pos[j*3+1], dz=pos[i*3+2]-pos[j*3+2];
      const d = Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(d < maxD){
        // intensidade: proximidade × cintilação neural (varia no tempo)
        const prox = 1 - d/maxD;
        const flick = 0.35 + 0.65*Math.abs(Math.sin(t*2.2 + (i*13+j)*0.7));
        const b = prox*flick;
        lp[li++]=pos[i*3]; lp[li++]=pos[i*3+1]; lp[li++]=pos[i*3+2];
        lp[li++]=pos[j*3]; lp[li++]=pos[j*3+1]; lp[li++]=pos[j*3+2];
        for(let k=0;k<2;k++){ lc[ci++]=base.r*b; lc[ci++]=base.g*b; lc[ci++]=base.b*b; }
        linkCount++;
        if(li >= lp.length-6) { i=n; break; }
      }
    }
  }
  linkGeo.setDrawRange(0, linkCount*2);
  linkGeo.attributes.position.needsUpdate = true;
  linkGeo.attributes.color.needsUpdate = true;
}

/* ---------------------------------------------------------------------- */
/* 4. POEIRA DE FUNDO                                                      */
/* ---------------------------------------------------------------------- */
function buildDust(){
  const n=CFG.dustCount, p=new Float32Array(n*3);
  for(let i=0;i<n;i++){ const r=11+Math.random()*24, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    p[i*3]=r*Math.sin(ph)*Math.cos(th); p[i*3+1]=r*Math.sin(ph)*Math.sin(th); p[i*3+2]=r*Math.cos(ph); }
  const g=new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(p,3));
  dust = new T.Points(g, new T.PointsMaterial({ color:CFG.cAmber, size:0.09,
    transparent:true, opacity:0.4, blending:T.AdditiveBlending, depthWrite:false }));
  scene.add(dust);
}

/* ---------------------------------------------------------------------- */
/* PÓS-PROCESSAMENTO — Bloom (glow holográfico) + Glitch esporádico         */
/* ---------------------------------------------------------------------- */
function setupPostFX(){
  if(!T.EffectComposer){ // fallback caso os módulos externos falhem
    document.getElementById('err').style.display='block';
    document.getElementById('err').textContent='PÓS-PROCESSAMENTO INDISPONÍVEL — a renderizar sem bloom';
    return;
  }
  composer = new T.EffectComposer(renderer);
  composer.addPass(new T.RenderPass(scene, camera));

  bloomPass = new T.UnrealBloomPass(new T.Vector2(innerWidth,innerHeight),
    CFG.bloomStrength, CFG.bloomRadius, CFG.bloomThreshold);
  composer.addPass(bloomPass);

  if(T.GlitchPass){
    glitchPass = new T.GlitchPass();
    glitchPass.enabled = false;   // ligado só em pulsos esporádicos
    composer.addPass(glitchPass);
  }
  // passe final SEMPRE ativo (CopyShader) — garante que a imagem chega ao ecrã
  // mesmo quando o glitch (último passe) está desligado.
  if(T.CopyShader){
    const copy = new T.ShaderPass(T.CopyShader);
    copy.renderToScreen = true;
    composer.addPass(copy);
  }
}
let glitchUntil = 0;
function triggerGlitch(ms){ if(glitchPass){ glitchPass.enabled=true; glitchUntil = performance.now()+ (ms||260); } }

/* ---------------------------------------------------------------------- */
/* EVENTOS + RESIZE                                                        */
/* ---------------------------------------------------------------------- */
function bindEvents(){
  addEventListener('mousemove', e=>{ mouse.x=e.clientX; mouse.y=e.clientY;
    target.x=(e.clientX/innerWidth-0.5); target.y=(e.clientY/innerHeight-0.5); });
  addEventListener('touchmove', e=>{ const t=e.touches[0]; mouse.x=t.clientX; mouse.y=t.clientY;
    target.x=(t.clientX/innerWidth-0.5); target.y=(t.clientY/innerHeight-0.5); }, {passive:true});
  addEventListener('resize', J.resize);

  document.getElementById('glitchBtn').addEventListener('click', ()=>triggerGlitch(500));
  document.getElementById('dlBtn').addEventListener('click', downloadSelf);
  // pulsos automáticos raros
  setInterval(()=>{ if(Math.random()<0.5) triggerGlitch(180); }, 6500);
  setInterval(()=>{ document.getElementById('pwr').textContent=(94+Math.floor(Math.random()*6))+'%'; }, 1500);
}

J.resize = function(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if(composer) composer.setSize(innerWidth, innerHeight);
  if(bloomPass) bloomPass.setSize(innerWidth, innerHeight);
  if(corePoints) corePoints.material.uniforms.uPixel.value = Math.min(devicePixelRatio,2);
};

/* ---------------------------------------------------------------------- */
/* ANIMATE                                                                */
/* ---------------------------------------------------------------------- */
J.animate = function(){
  requestAnimationFrame(J.animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  // --- núcleo: turbulência procedural (Simplex noise) + pulsação ---
  const pos = corePoints.geometry.attributes.position.array;
  const pulse = 1 + Math.sin(t*CFG.pulseSpeed)*CFG.pulseAmt;
  for(let i=0;i<pos.length;i+=3){
    const bx=coreBase[i], by=coreBase[i+1], bz=coreBase[i+2];
    const nx=coreNormals[i], ny=coreNormals[i+1], nz=coreNormals[i+2];
    const nz3 = simplex.noise3d(
      bx*CFG.noiseFreq + t*CFG.noiseSpeed,
      by*CFG.noiseFreq,
      bz*CFG.noiseFreq - t*CFG.noiseSpeed);
    const disp = (0.5 + nz3*0.5) * CFG.noiseAmp * pulse;
    pos[i]   = (bx + nx*disp)*pulse;
    pos[i+1] = (by + ny*disp)*pulse;
    pos[i+2] = (bz + nz*disp)*pulse;
  }
  corePoints.geometry.attributes.position.needsUpdate = true;
  const heart = coreGroup.getObjectByName('heart');
  if(heart){ heart.scale.setScalar(pulse*1.05); heart.material.opacity=0.1+0.06*Math.sin(t*CFG.pulseSpeed); }

  coreGroup.rotation.y += dt*CFG.spinCore;
  coreGroup.rotation.x  = Math.sin(t*0.18)*0.12;

  // --- anéis independentes ---
  rings.forEach(r=>{ const s=r.userData.spin;
    r.rotation.x+=dt*s.x; r.rotation.y+=dt*s.y; r.rotation.z+=dt*s.z; });

  // --- constelação: física de repulsão do cursor + retorno suave (lerp) ---
  mouseWorld.set(target.x*2, -target.y*2, 0)
    .unproject(camera).sub(camera.position).normalize();
  const dist = -camera.position.z / mouseWorld.z;
  const mw = camera.position.clone().add(mouseWorld.multiplyScalar(dist));
  const cp = constel.geometry.attributes.position.array;
  const n = CFG.constelPts;
  for(let i=0;i<n;i++){
    const ix=i*3;
    // força de repulsão
    let dx=cp[ix]-mw.x, dy=cp[ix+1]-mw.y, dz=cp[ix+2]-mw.z;
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
    if(d < CFG.repelRadius && mouse.x>-900){
      const f=(1-d/CFG.repelRadius)*CFG.repelForce;
      constelVel[ix]+=(dx/d)*f*dt; constelVel[ix+1]+=(dy/d)*f*dt; constelVel[ix+2]+=(dz/d)*f*dt;
    }
    // mola de volta à posição de repouso + amortecimento
    constelVel[ix]   += (constelBase[ix]  -cp[ix]  )*2.2*dt;
    constelVel[ix+1] += (constelBase[ix+1]-cp[ix+1])*2.2*dt;
    constelVel[ix+2] += (constelBase[ix+2]-cp[ix+2])*2.2*dt;
    constelVel[ix]*=0.9; constelVel[ix+1]*=0.9; constelVel[ix+2]*=0.9;
    cp[ix]+=constelVel[ix]; cp[ix+1]+=constelVel[ix+1]; cp[ix+2]+=constelVel[ix+2];
  }
  constel.geometry.attributes.position.needsUpdate = true;
  constel.rotation.y += dt*0.05;
  updateLinks(t);
  document.getElementById('links').textContent = String(linkCount);

  dust.rotation.y += dt*CFG.spinDust; dust.rotation.x += dt*CFG.spinDust*0.4;

  // --- parallax da câmara ---
  cur.x += (target.x-cur.x)*0.045; cur.y += (target.y-cur.y)*0.045;
  camera.position.x = cur.x*7*CFG.parallax;
  camera.position.y = -cur.y*5*CFG.parallax;
  camera.lookAt(0,0,0);

  // desliga glitch quando o pulso termina
  if(glitchPass && glitchPass.enabled && performance.now()>glitchUntil) glitchPass.enabled=false;

  if(composer) composer.render(); else renderer.render(scene,camera);
};

function downloadSelf(){
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'jarvis-nucleo.html';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

(function boot(tries){
  if(window.THREE && window.THREE.SimplexNoise){
    try{ J.init(); J.animate(); }
    catch(e){ document.getElementById('err').style.display='block';
      document.getElementById('err').textContent='ERRO: '+e.message; console.error(e); }
  } else if(tries<80){ setTimeout(()=>boot(tries+1), 60); }
  else { document.getElementById('loading').textContent='FALHA AO CARREGAR MÓDULOS THREE.JS'; }
})(0);
