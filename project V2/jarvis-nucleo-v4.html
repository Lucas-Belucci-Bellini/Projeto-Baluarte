<style>
  :root{--bg:#0b0910;--accent:#d4a24e;--accent2:#eec886;--txt:#f4ecdd;--dim:#9d9078;
    --line:rgba(212,162,78,0.22);--glow:rgba(212,162,78,0.4)}

  .corner{position:fixed;z-index:6;width:54px;height:54px;border-color:var(--accent);opacity:.5;pointer-events:none}
  .tl{top:20px;left:20px;border-top:1.5px solid;border-left:1.5px solid}
  .tr{top:20px;right:20px;border-top:1.5px solid;border-right:1.5px solid}

  #title{position:fixed;z-index:6;top:38px;left:0;right:0;text-align:center;pointer-events:none;
    text-transform:uppercase;text-shadow:0 0 18px var(--glow),0 2px 14px rgba(6,4,10,.95)}

<script>
/* ════════════════════════════════════════════════════════════════════════
   NÚCLEO J.A.R.V.I.S. v4 — Projeto Baluarte
   Novo na v4:
   · órbita real com o ponteiro (arrastar) + zoom na roda, com amortecimento;
   · arcos de energia do plasma para a gaiola, regerados em ciclos curtos;
   · fagulhas de dados percorrendo os anéis (herdam a rotação de cada anel);
   · glifos hexagonais Baluarte marcando nós da rede neural;
   · passe de composição final: aberração cromática radial, grão de filme,
     linhas de varrimento e vinheta — no lugar do CopyShader cru;
   · degradação automática de qualidade se os fps caírem.
   Herdado da v3:
   · esfera oclusora dentro do núcleo → o coração lê como VOLUME, não como
     mancha branca (as partículas do fundo deixam de somar por cima);
   · rampa de cor por deslocamento (ouro fundo → âmbar nas cristas) via
     atributo aDisp, em vez de branco uniforme;
   · halo de Fresnel na borda → silhueta legível sem estourar o bloom;
   · gaiola hexagonal dupla contrarrotativa → estrutura em volta do plasma;
   · anel-mostrador (astrolábio) com marcas, alinhado ao eixo do núcleo;
   · bloom com limiar alto + ACESFilmic → brilho sem clipar em branco;
   · rede neural mais esparsa e com linhas por proximidade real (menos teia).
   ► AFINE TUDO NO OBJETO CFG ◄
   ════════════════════════════════════════════════════════════════════════ */
const CFG = {
  cCoreDeep:  0xb9762a,   // vales do plasma (ouro escuro)
  cCoreHigh:  0xffdf9f,   // cristas do plasma (âmbar claro)
  cCage:      0xd4a24e,   // gaiola hexagonal
  cRings:     0xf0a83c,   // anéis de dados
  cRingAlt:   0xffb347,
  cConstel:   0xffd07a,   // rede neural
  cDust:      0xff9c3a,
  bg:         0x0b0910,

  spinCore: 0.09, spinRings: 0.42, spinDust: 0.025, spinCage: 0.14,
  coreDetail: 4, ringCount: 5, constelPts: 120, dustCount: 1200,
  noiseFreq: 1.35, noiseAmp: 0.40, noiseSpeed: 0.30,
  pulseSpeed: 1.15, pulseAmt: 0.10,
  bloomStrength: 0.85, bloomRadius: 0.55, bloomThreshold: 0.62, exposure: 1.0,
  parallax: 0.42, repelRadius: 2.6, repelForce: 1.7,
  linkDist: 2.55, linkOpacity: 0.55,

  arcCount: 5, arcSegs: 9, arcLife: 0.26,   // arcos de energia
  sparkPerRing: 4, sparkSpeed: 0.55,        // fagulhas nos anéis
  glyphCount: 14,                           // glifos hexagonais
  aberration: 0.0018, grain: 0.05, vignette: 0.26,
  orbitMin: 8.5, orbitMax: 26,

  stripText: 'BALUARTE · MARK XIII · NUCLEO ATIVO · SINCRONIA 99.4 · REDE NEURAL · ',
  trailLen: 7,          // pontos de rasto por fagulha
  bootDur: 2.4,         // ignição inicial (s)
};

/* sprite radial reaproveitado por todos os Points (evita quadrados duros) */
let SPRITE = null;
function glowSprite(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64,64,0, 64,64,64);
  grad.addColorStop(0,   'rgba(255,255,255,1)');
  grad.addColorStop(0.22,'rgba(255,226,172,0.92)');
  grad.addColorStop(0.55,'rgba(255,172,64,0.30)');
  grad.addColorStop(1,   'rgba(255,140,20,0)');
  g.fillStyle = grad; g.fillRect(0,0,128,128);
  return new T.CanvasTexture(c);
}

const T = window.THREE;
let scene, camera, renderer, composer, bloomPass;
let coreGroup, corePoints, coreBase, coreNormals, coreDisp, occluder, rim, simplex;
let cages = [], rings = [];
let constel, constelBase, constelVel, linkGeo;
let dust, spinning = true, linkCount = 0;
let arcGeo, arcMat, arcClock = 0, sparks = [], glyphs, compPass;
let strips = [], waves = [], frame = 0, booted = 0;
const target = {x:0,y:0}, cur = {x:0,y:0};
const mouse = new T.Vector2(-999,-999), mw = new T.Vector3();
const clock = new T.Clock();
const orb = {yaw:0, pitch:0.14, dist:14, tYaw:0, tPitch:0.14, tDist:14, drag:false, lx:0, ly:0};
const fpsMeter = {acc:0, n:0, quality:2};
function randDir(){
  const z = Math.random()*2-1, a = Math.random()*Math.PI*2, s = Math.sqrt(1-z*z);
  return new T.Vector3(Math.cos(a)*s, Math.sin(a)*s, z);
}

function init(){
  scene = new T.Scene();
  scene.fog = new T.FogExp2(CFG.bg, 0.030);
  camera = new T.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
  camera.position.set(0, 0, 14);

  renderer = new T.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(CFG.bg, 1);
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = CFG.exposure;
  document.getElementById('stage').appendChild(renderer.domElement);

  simplex = new T.SimplexNoise();
  SPRITE = glowSprite();
  coreGroup = new T.Group(); scene.add(coreGroup);
  buildCore(); buildCages(); buildRings(); buildArcs(); buildSparks();
  buildStrips(); buildWaves();
  buildConstellation(); buildGlyphs(); buildDust(); postFX(); bind();
  orb.dist = 25;  // ignição: a câmara entra amortecida até orb.tDist

  document.getElementById('pcount').textContent = (coreBase.length/3|0).toLocaleString('pt-BR');
  const ld = document.getElementById('loading');
  ld.style.opacity = '0'; setTimeout(()=>ld.remove(), 750);
}

/* 1 ─ CORAÇÃO DE PLASMA: micropartículas + oclusor + halo de borda ───────── */
function buildCore(){
  const geo = new T.IcosahedronGeometry(2.0, CFG.coreDetail);
  coreBase = Float32Array.from(geo.attributes.position.array);
  coreNormals = new Float32Array(coreBase.length);
  for(let i=0;i<coreBase.length;i+=3){
    const v = new T.Vector3(coreBase[i],coreBase[i+1],coreBase[i+2]).normalize();
    coreNormals[i]=v.x; coreNormals[i+1]=v.y; coreNormals[i+2]=v.z;
  }
  coreDisp = new Float32Array(coreBase.length/3);
  const pGeo = new T.BufferGeometry();
  pGeo.setAttribute('position', new T.BufferAttribute(Float32Array.from(coreBase),3));
  pGeo.setAttribute('aDisp', new T.BufferAttribute(coreDisp,1));

  corePoints = new T.Points(pGeo, new T.ShaderMaterial({
    uniforms:{
      uDeep:{value:new T.Color(CFG.cCoreDeep)}, uHigh:{value:new T.Color(CFG.cCoreHigh)},
      uSize:{value:3.2}, uPixel:{value:Math.min(devicePixelRatio,2)}, uNear:{value:1.0},
    },
    transparent:true, depthWrite:false, depthTest:true, blending:T.AdditiveBlending,
    vertexShader:`
      attribute float aDisp; uniform float uSize; uniform float uPixel;
      varying float vDist; varying float vD;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        vDist = -mv.z; vD = aDisp;
        // teto no tamanho: perto da câmara os pontos deixam de crescer e
        // portanto de somar até clipar em branco
        gl_PointSize = min(uSize * uPixel * (60.0/vDist) * (0.7 + vD*0.7), 7.5*uPixel);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader:`
      uniform vec3 uDeep; uniform vec3 uHigh; uniform float uNear;
      varying float vDist; varying float vD;
      void main(){
        vec2 c = gl_PointCoord - 0.5;
        float d = length(c);
        if(d > 0.5) discard;
        float core = smoothstep(0.5, 0.05, d);
        float fade = smoothstep(20.0, 5.0, vDist);
        vec3 col = mix(uDeep, uHigh, clamp(vD*1.15, 0.0, 1.0));
        gl_FragColor = vec4(col, core * fade * (0.24 + vD*0.42) * uNear);
      }`
  }));
  coreGroup.add(corePoints);

  // corpo do núcleo: casca opaca que dá volume (esconde o hemisfério de trás),
  // agora com brasa interna — metal fundido por baixo da pele de partículas.
  occluder = new T.Mesh(new T.SphereGeometry(1.80, 48, 32), new T.ShaderMaterial({
    uniforms:{ uDark:{value:new T.Color(0x0a0810)}, uEmber:{value:new T.Color(0x5e2c0c)},
      uInt:{value:1.0} },
    vertexShader:`
      varying vec3 vN; varying vec3 vV;
      void main(){
        vN = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        vV = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader:`
      uniform vec3 uDark; uniform vec3 uEmber; uniform float uInt;
      varying vec3 vN; varying vec3 vV;
      void main(){
        float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.2);
        gl_FragColor = vec4(mix(uDark, uEmber, f*uInt), 1.0);
      }`
  }));
  coreGroup.add(occluder);

  // halo de Fresnel: acende só a borda vista de raspão
  rim = new T.Mesh(new T.SphereGeometry(2.22, 48, 32), new T.ShaderMaterial({
    uniforms:{ uColor:{value:new T.Color(CFG.cRingAlt)}, uPow:{value:3.2}, uInt:{value:0.55} },
    transparent:true, depthWrite:false, blending:T.AdditiveBlending, side:T.BackSide,
    vertexShader:`
      varying vec3 vN; varying vec3 vV;
      void main(){
        vN = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        vV = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader:`
      uniform vec3 uColor; uniform float uPow; uniform float uInt;
      varying vec3 vN; varying vec3 vV;
      void main(){
        float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), uPow);
        gl_FragColor = vec4(uColor, f * uInt);
      }`
  }));
  coreGroup.add(rim);
}

/* 2 ─ GAIOLA HEXAGONAL DUPLA (estrutura em volta do plasma) ─────────────── */
function buildCages(){
  [[2.55, 1, 0.30], [3.05, 2, 0.16]].forEach(([r, detail, op], i)=>{
    const cage = new T.LineSegments(
      new T.WireframeGeometry(new T.IcosahedronGeometry(r, detail)),
      new T.LineBasicMaterial({color:CFG.cCage, transparent:true, opacity:op,
        blending:T.AdditiveBlending, depthWrite:false}));
    cage.userData.dir = i%2 ? -1 : 1;
    coreGroup.add(cage); cages.push(cage);
  });
}

/* 3 ─ ANÉIS DE DADOS (tracejado + mostrador + nós) ─────────────────────── */
function circleGeo(radius, segments){
  const pts=[];
  for(let i=0;i<=segments;i++){ const a=i/segments*Math.PI*2;
    pts.push(new T.Vector3(Math.cos(a)*radius, Math.sin(a)*radius, 0)); }
  return new T.BufferGeometry().setFromPoints(pts);
}
function buildRings(){
  for(let i=0;i<CFG.ringCount;i++){
    const g = new T.Group(), R = 3.7 + i*0.72, col = i%2 ? CFG.cRingAlt : CFG.cRings;
    const dash = new T.Line(circleGeo(R,240), new T.LineDashedMaterial({color:col,
      transparent:true, opacity:0.42-i*0.04, dashSize:0.14+(i%3)*0.1,
      gapSize:0.08+(i%2)*0.14, blending:T.AdditiveBlending, depthWrite:false}));
    dash.computeLineDistances(); g.add(dash);

    const marks = i%2 ? 48 : 72, mv=[];
    for(let k=0;k<marks;k++){ const a=k/marks*Math.PI*2;
      const inner = (k%6===0) ? R-0.24 : R-0.10;
      mv.push(Math.cos(a)*inner, Math.sin(a)*inner, 0, Math.cos(a)*R, Math.sin(a)*R, 0); }
    const mg = new T.BufferGeometry();
    mg.setAttribute('position', new T.Float32BufferAttribute(mv,3));
    g.add(new T.LineSegments(mg, new T.LineBasicMaterial({color:col, transparent:true,
      opacity:0.26, blending:T.AdditiveBlending, depthWrite:false})));

    const nodes = 3+(i%4), nv=[], vv=[];
    for(let k=0;k<nodes;k++){ const a=(k/nodes)*Math.PI*2+i;
      const x=Math.cos(a)*R, y=Math.sin(a)*R;
      nv.push(x,y,0);
      vv.push(x,y,0, Math.cos(a)*(R+0.34), Math.sin(a)*(R+0.34), 0); }
    const ng=new T.BufferGeometry(); ng.setAttribute('position', new T.Float32BufferAttribute(nv,3));
    g.add(new T.Points(ng, new T.PointsMaterial({color:CFG.cRingAlt, size:0.16, map:SPRITE,
      transparent:true, opacity:0.9, blending:T.AdditiveBlending, depthWrite:false})));
    const vg=new T.BufferGeometry(); vg.setAttribute('position', new T.Float32BufferAttribute(vv,3));
    g.add(new T.LineSegments(vg, new T.LineBasicMaterial({color:CFG.cRingAlt,
      transparent:true, opacity:0.55, blending:T.AdditiveBlending, depthWrite:false})));

    g.rotation.x = Math.PI*(0.12+i*0.17);
    g.rotation.y = Math.PI*(i*0.21);
    g.userData.spin = {
      x:(Math.random()-0.5)*CFG.spinRings*0.5,
      y:(Math.random()-0.5)*CFG.spinRings*0.5,
      z:(0.3+Math.random()*0.5)*CFG.spinRings*(i%2?1:-1),
    };
    coreGroup.add(g); rings.push(g);
  }
}

/* 3b ─ ARCOS DE ENERGIA: plasma → gaiola, regerados em ciclos curtos ───── */
function buildArcs(){
  const max = CFG.arcCount * CFG.arcSegs * 2;
  arcGeo = new T.BufferGeometry();
  arcGeo.setAttribute('position', new T.BufferAttribute(new Float32Array(max*3),3));
  arcMat = new T.LineBasicMaterial({color:CFG.cCoreHigh, transparent:true, opacity:0.8,
    blending:T.AdditiveBlending, depthWrite:false});
  coreGroup.add(new T.LineSegments(arcGeo, arcMat));
  regenArcs();
}
function regenArcs(){
  const p = arcGeo.attributes.position.array; let k = 0;
  for(let a=0;a<CFG.arcCount;a++){
    const dir = randDir();
    const start = dir.clone().multiplyScalar(2.06);
    const end = dir.clone()
      .applyAxisAngle(randDir(), 0.25 + Math.random()*0.55)
      .multiplyScalar(2.5 + Math.random()*0.62);
    let prev = start;
    for(let s=1;s<=CFG.arcSegs;s++){
      const t = s/CFG.arcSegs;
      const pt = start.clone().lerp(end, t);
      const jit = 0.22*Math.sin(t*Math.PI);
      pt.x += (Math.random()-0.5)*jit; pt.y += (Math.random()-0.5)*jit;
      pt.z += (Math.random()-0.5)*jit;
      p[k++]=prev.x; p[k++]=prev.y; p[k++]=prev.z;
      p[k++]=pt.x;   p[k++]=pt.y;   p[k++]=pt.z;
      prev = pt;
    }
  }
  arcGeo.attributes.position.needsUpdate = true;
}

/* 3c ─ FAGULHAS DE DADOS percorrendo cada anel ─────────────────────────── */
function buildSparks(){
  rings.forEach((g, i)=>{
    const R = 3.7 + i*0.72, n = CFG.sparkPerRing;
    const pos = new Float32Array(n*3);
    const geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.BufferAttribute(pos,3));
    const pts = new T.Points(geo, new T.PointsMaterial({color:CFG.cCoreHigh, size:0.26, map:SPRITE,
      transparent:true, opacity:0.95, blending:T.AdditiveBlending, depthWrite:false}));
    g.add(pts);
    const data = [];
    for(let k=0;k<n;k++) data.push({
      a: Math.random()*Math.PI*2,
      v: (0.5+Math.random()*0.9)*CFG.sparkSpeed*(k%2?1:-1),
      hist: [],
    });
    // rasto: segmentos ligando as últimas posições de cada fagulha
    const tGeo = new T.BufferGeometry();
    tGeo.setAttribute('position',
      new T.BufferAttribute(new Float32Array(n*(CFG.trailLen-1)*6),3));
    tGeo.setAttribute('color',
      new T.BufferAttribute(new Float32Array(n*(CFG.trailLen-1)*6),3));
    g.add(new T.LineSegments(tGeo, new T.LineBasicMaterial({vertexColors:true,
      transparent:true, opacity:0.85, blending:T.AdditiveBlending, depthWrite:false})));
    sparks.push({geo, data, R, tGeo});
  });
}
function updateSparks(dt){
  const col = new T.Color(CFG.cCoreHigh);
  for(const s of sparks){
    const p = s.geo.attributes.position.array;
    const tp = s.tGeo.attributes.position.array, tc = s.tGeo.attributes.color.array;
    let li = 0, ci = 0;
    s.data.forEach((d, k)=>{
      d.a += d.v*dt;
      const x = Math.cos(d.a)*s.R, y = Math.sin(d.a)*s.R;
      p[k*3] = x; p[k*3+1] = y; p[k*3+2] = 0;
      d.hist.unshift(x, y);
      if(d.hist.length > CFG.trailLen*2) d.hist.length = CFG.trailLen*2;
      for(let h=0; h<CFG.trailLen-1; h++){
        const i0 = h*2, i1 = (h+1)*2;
        const ax = d.hist[i0], ay = d.hist[i0+1];
        const bx = d.hist[i1], by = d.hist[i1+1];
        const b = (ax === undefined || bx === undefined) ? 0 : 1 - h/(CFG.trailLen-1);
        tp[li++] = ax||0; tp[li++] = ay||0; tp[li++] = 0;
        tp[li++] = bx||0; tp[li++] = by||0; tp[li++] = 0;
        for(let q=0;q<2;q++){ tc[ci++]=col.r*b*0.8; tc[ci++]=col.g*b*0.8; tc[ci++]=col.b*b*0.8; }
      }
    });
    s.geo.attributes.position.needsUpdate = true;
    s.tGeo.attributes.position.needsUpdate = true;
    s.tGeo.attributes.color.needsUpdate = true;
  }
}

/* 3d ─ ANEL DE DADOS: tira de glifos monoespaçados girando em volta ────── */
function stripTexture(text, px){
  const c = document.createElement('canvas'); c.width = 2048; c.height = 64;
  const g = c.getContext('2d');
  g.font = '600 ' + px + 'px ui-monospace,"IBM Plex Mono",monospace';
  g.fillStyle = '#ffd89a'; g.textBaseline = 'middle';
  const pitch = 2048/text.length;
  for(let i=0;i<text.length;i++) g.fillText(text[i], i*pitch + pitch*0.18, 34);
  const t = new T.CanvasTexture(c);
  t.wrapS = T.RepeatWrapping; t.repeat.x = 2;
  return t;
}
function buildStrips(){
  [[3.42, 0.30, 40, 0.11, 0.42, 1], [4.70, 0.20, 30, -0.22, 0.26, -1]].forEach(
    ([R, h, px, tilt, op, dir])=>{
      const m = new T.Mesh(
        new T.CylinderGeometry(R, R, h, 96, 1, true),
        new T.MeshBasicMaterial({map:stripTexture(CFG.stripText, px), transparent:true,
          opacity:op, blending:T.AdditiveBlending, depthWrite:false, side:T.DoubleSide}));
      m.rotation.x = Math.PI/2 + tilt;   // fica de pé, como um mostrador
      m.userData.dir = dir;
      coreGroup.add(m); strips.push(m);
    });
}

/* 3e ─ ONDAS DE CHOQUE: resposta visível ao pulso de dados ────────────── */
function buildWaves(){
  for(let i=0;i<3;i++){
    const m = new T.Mesh(new T.SphereGeometry(1, 40, 26), new T.ShaderMaterial({
      uniforms:{ uColor:{value:new T.Color(CFG.cRingAlt)}, uInt:{value:0.0} },
      transparent:true, depthWrite:false, blending:T.AdditiveBlending, side:T.DoubleSide,
      vertexShader:`
        varying vec3 vN; varying vec3 vV;
        void main(){
          vN = normalize(normalMatrix * normal);
          vec4 mv = modelViewMatrix * vec4(position,1.0);
          vV = normalize(-mv.xyz);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader:`
        uniform vec3 uColor; uniform float uInt; varying vec3 vN; varying vec3 vV;
        void main(){
          float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 4.0);
          gl_FragColor = vec4(uColor, f * uInt);
        }`
    }));
    m.visible = false; m.userData.t = 0;
    scene.add(m); waves.push(m);
  }
}
function fireWave(){
  const w = waves.find(x=>!x.visible) || waves[0];
  w.visible = true; w.userData.t = 0; w.scale.setScalar(2.1);
}
function updateWaves(dt){
  for(const w of waves){
    if(!w.visible) continue;
    w.userData.t += dt;
    const p = w.userData.t/1.25;
    if(p >= 1){ w.visible = false; w.material.uniforms.uInt.value = 0; continue; }
    w.scale.setScalar(2.1 + p*7.2);
    w.material.uniforms.uInt.value = 0.55*(1-p)*(1-p);
  }
}

/* 4 ─ REDE NEURAL (nós + sinapses que acendem) ─────────────────────────── */
function buildConstellation(){
  const n = CFG.constelPts;
  constelBase = new Float32Array(n*3);
  const p = new Float32Array(n*3);
  constelVel = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const r = 5.8+Math.random()*4.2, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    const x=r*Math.sin(ph)*Math.cos(th), y=r*Math.sin(ph)*Math.sin(th)*0.78, z=r*Math.cos(ph);
    constelBase[i*3]=p[i*3]=x; constelBase[i*3+1]=p[i*3+1]=y; constelBase[i*3+2]=p[i*3+2]=z;
  }
  const pg = new T.BufferGeometry();
  pg.setAttribute('position', new T.BufferAttribute(p,3));
  constel = new T.Points(pg, new T.PointsMaterial({color:CFG.cConstel, size:0.15, map:SPRITE,
    transparent:true, opacity:0.85, blending:T.AdditiveBlending, depthWrite:false}));
  scene.add(constel);

  const maxLinks = n*5;
  linkGeo = new T.BufferGeometry();
  linkGeo.setAttribute('position', new T.BufferAttribute(new Float32Array(maxLinks*6),3));
  linkGeo.setAttribute('color', new T.BufferAttribute(new Float32Array(maxLinks*6),3));
  scene.add(new T.LineSegments(linkGeo, new T.LineBasicMaterial({vertexColors:true,
    transparent:true, opacity:CFG.linkOpacity, blending:T.AdditiveBlending, depthWrite:false})));
}
function updateLinks(t){
  const pos = constel.geometry.attributes.position.array;
  const lp = linkGeo.attributes.position.array, lc = linkGeo.attributes.color.array;
  const n = CFG.constelPts, maxD = CFG.linkDist, base = new T.Color(CFG.cConstel);
  let li=0, ci=0; linkCount=0;
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    const dx=pos[i*3]-pos[j*3], dy=pos[i*3+1]-pos[j*3+1], dz=pos[i*3+2]-pos[j*3+2];
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(d>=maxD) continue;
    const b = (1-d/maxD) * (0.30 + 0.70*Math.abs(Math.sin(t*2.0 + (i*13+j)*0.7)));
    lp[li++]=pos[i*3]; lp[li++]=pos[i*3+1]; lp[li++]=pos[i*3+2];
    lp[li++]=pos[j*3]; lp[li++]=pos[j*3+1]; lp[li++]=pos[j*3+2];
    for(let k=0;k<2;k++){ lc[ci++]=base.r*b; lc[ci++]=base.g*b; lc[ci++]=base.b*b; }
    linkCount++;
    if(li >= lp.length-6){ i=n; break; }
  }
  linkGeo.setDrawRange(0, linkCount*2);
  linkGeo.attributes.position.needsUpdate = true;
  linkGeo.attributes.color.needsUpdate = true;
}

/* 4b ─ GLIFOS HEXAGONAIS marcando nós da rede ─────────────────────────── */
function hexTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  g.strokeStyle = '#ffd89a'; g.lineWidth = 4; g.beginPath();
  for(let i=0;i<6;i++){
    const a = i/6*Math.PI*2 + Math.PI/6;
    const x = 32+Math.cos(a)*22, y = 32+Math.sin(a)*22;
    i ? g.lineTo(x,y) : g.moveTo(x,y);
  }
  g.closePath(); g.stroke();
  g.fillStyle = 'rgba(255,190,110,0.22)'; g.fill();
  return new T.CanvasTexture(c);
}
function buildGlyphs(){
  const n = Math.min(CFG.glyphCount, CFG.constelPts);
  const geo = new T.BufferGeometry();
  geo.setAttribute('position', new T.BufferAttribute(new Float32Array(n*3),3));
  glyphs = new T.Points(geo, new T.PointsMaterial({map:hexTexture(), size:0.62,
    transparent:true, opacity:0.8, blending:T.AdditiveBlending, depthWrite:false}));
  glyphs.userData.n = n;
  scene.add(glyphs);
}
function updateGlyphs(t){
  const src = constel.geometry.attributes.position.array;
  const dst = glyphs.geometry.attributes.position.array;
  const n = glyphs.userData.n, step = Math.floor(CFG.constelPts/n);
  for(let i=0;i<n;i++){
    const j = (i*step)*3;
    dst[i*3]=src[j]; dst[i*3+1]=src[j+1]; dst[i*3+2]=src[j+2];
  }
  glyphs.geometry.attributes.position.needsUpdate = true;
  glyphs.rotation.copy(constel.rotation);
  glyphs.material.opacity = 0.6 + 0.25*Math.sin(t*1.1);
}

/* 5 ─ POEIRA ───────────────────────────────────────────────────────────── */
function buildDust(){
  const n=CFG.dustCount, p=new Float32Array(n*3);
  for(let i=0;i<n;i++){ const r=12+Math.random()*22, th=Math.random()*Math.PI*2,
    ph=Math.acos(2*Math.random()-1);
    p[i*3]=r*Math.sin(ph)*Math.cos(th); p[i*3+1]=r*Math.sin(ph)*Math.sin(th); p[i*3+2]=r*Math.cos(ph); }
  const g=new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(p,3));
  dust = new T.Points(g, new T.PointsMaterial({color:CFG.cDust, size:0.13, map:SPRITE,
    transparent:true, opacity:0.32, blending:T.AdditiveBlending, depthWrite:false}));
  scene.add(dust);
}

/* 6 ─ PÓS-PROCESSAMENTO ────────────────────────────────────────────────── */
function postFX(){
  if(!T.EffectComposer){
    const e=document.getElementById('err');
    e.style.display='block'; e.textContent='pós-processamento indisponível — renderizando sem bloom';
    return;
  }
  composer = new T.EffectComposer(renderer);
  composer.addPass(new T.RenderPass(scene, camera));
  bloomPass = new T.UnrealBloomPass(new T.Vector2(innerWidth,innerHeight),
    CFG.bloomStrength, CFG.bloomRadius, CFG.bloomThreshold);
  composer.addPass(bloomPass);
  // composição final: aberração cromática radial + grão + varrimento + vinheta
  compPass = new T.ShaderPass({
    uniforms:{
      tDiffuse:{value:null}, uTime:{value:0},
      uAb:{value:CFG.aberration}, uGrain:{value:CFG.grain}, uVig:{value:CFG.vignette},
    },
    vertexShader:`
      varying vec2 vUv;
      void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      uniform sampler2D tDiffuse; uniform float uTime; uniform float uAb;
      uniform float uGrain; uniform float uVig; varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
      void main(){
        vec2 uv = vUv, c = uv-0.5;
        float r = length(c);
        vec2 off = normalize(c + 1e-6) * uAb * (r*r*2.2 + 0.15);
        vec3 col;
        col.r = texture2D(tDiffuse, uv+off).r;
        col.g = texture2D(tDiffuse, uv).g;
        col.b = texture2D(tDiffuse, uv-off).b;
        col += (hash(uv*vec2(1920.0,1080.0) + uTime*57.0) - 0.5) * uGrain;
        col *= 0.985 + 0.015*sin(uv.y*1300.0);
        col *= 1.0 - uVig*smoothstep(0.34, 0.98, r);
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  compPass.renderToScreen = true;
  composer.addPass(compPass);
}

/* pulso de dados: sobretom de energia (sem glitch destrutivo) ───────────── */
let pulseUntil = 0;
function pulse(ms){ pulseUntil = performance.now() + (ms||600); fireWave(); }

function bind(){
  const stageEl = document.getElementById('stage');
  addEventListener('mousemove', e=>{ mouse.x=e.clientX; mouse.y=e.clientY;
    target.x=(e.clientX/innerWidth-0.5); target.y=(e.clientY/innerHeight-0.5);
    if(orb.drag){
      orb.tYaw   -= (e.clientX-orb.lx)*0.006;
      orb.tPitch  = Math.max(-1.15, Math.min(1.15, orb.tPitch + (e.clientY-orb.ly)*0.005));
      orb.lx = e.clientX; orb.ly = e.clientY;
    } });
  stageEl.addEventListener('mousedown', e=>{ orb.drag=true; orb.lx=e.clientX; orb.ly=e.clientY;
    stageEl.classList.add('drag'); });
  addEventListener('mouseup', ()=>{ orb.drag=false; stageEl.classList.remove('drag'); });
  addEventListener('wheel', e=>{
    orb.tDist = Math.max(CFG.orbitMin, Math.min(CFG.orbitMax,
      orb.tDist * (1 + e.deltaY*0.0012)));
  }, {passive:true});
  addEventListener('touchmove', e=>{ const t=e.touches[0]; mouse.x=t.clientX; mouse.y=t.clientY;
    target.x=(t.clientX/innerWidth-0.5); target.y=(t.clientY/innerHeight-0.5); }, {passive:true});
  addEventListener('resize', resize);
  document.getElementById('bPulse').onclick = ()=>pulse(700);
  const bs = document.getElementById('bSpin');
  bs.onclick = ()=>{ spinning=!spinning; bs.setAttribute('aria-pressed', String(spinning)); };
  document.getElementById('bDl').onclick = downloadSelf;
  setInterval(()=>{
    document.getElementById('pwr').textContent = (95+Math.floor(Math.random()*5))+'%';
    document.getElementById('lat').textContent =
      String(2+Math.floor(Math.random()*6)).padStart(2,'0')+' ms';
  }, 1600);
  setInterval(()=>{ if(Math.random()<0.35) pulse(420); }, 7000);
}

function resize(){
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if(composer) composer.setSize(innerWidth, innerHeight);
  if(bloomPass) bloomPass.setSize(innerWidth, innerHeight);
  corePoints.material.uniforms.uPixel.value = Math.min(devicePixelRatio,2);
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.getElapsedTime();
  const boost = performance.now() < pulseUntil ? 1 : 0;
  frame++;

  // ignição: o núcleo acende e cresce nos primeiros segundos
  const bootP = Math.min(1, t/CFG.bootDur);
  const boot = 1 - Math.pow(1-bootP, 3);
  if(!booted && bootP >= 1){ booted = 1; fireWave(); }

  // plasma: turbulência + rampa de cor por deslocamento
  const pos = corePoints.geometry.attributes.position.array;
  const pulseS = (1 + Math.sin(t*CFG.pulseSpeed)*CFG.pulseAmt + boost*0.05) * (0.35 + 0.65*boot);
  for(let i=0, k=0; i<pos.length; i+=3, k++){
    const bx=coreBase[i], by=coreBase[i+1], bz=coreBase[i+2];
    const n3 = simplex.noise3d(
      bx*CFG.noiseFreq + t*CFG.noiseSpeed, by*CFG.noiseFreq,
      bz*CFG.noiseFreq - t*CFG.noiseSpeed);
    const u = 0.5 + n3*0.5;
    const disp = u * CFG.noiseAmp * pulseS;
    coreDisp[k] = u;
    pos[i]   = (bx + coreNormals[i]  *disp)*pulseS;
    pos[i+1] = (by + coreNormals[i+1]*disp)*pulseS;
    pos[i+2] = (bz + coreNormals[i+2]*disp)*pulseS;
  }
  corePoints.geometry.attributes.position.needsUpdate = true;
  corePoints.geometry.attributes.aDisp.needsUpdate = true;
  occluder.scale.setScalar(pulseS);
  occluder.material.uniforms.uInt.value = 0.55 + 0.45*Math.sin(t*CFG.pulseSpeed*0.8) + boost*0.5;
  rim.scale.setScalar(pulseS);
  rim.material.uniforms.uInt.value = 0.5 + 0.16*Math.sin(t*CFG.pulseSpeed) + boost*0.35;
  // exposição dependente da distância: ao aproximar, o plasma perde alfa e o
  // bloom perde força — é isso que impede o estouro branco no zoom.
  const near = Math.max(0.30, Math.min(1, (orb.dist - 7.0)/7.5));
  corePoints.material.uniforms.uNear.value = near;
  if(bloomPass) bloomPass.strength = CFG.bloomStrength*(0.35 + 0.65*near) + boost*0.4;

  // arcos de energia: novo conjunto a cada ciclo, opacidade decaindo no ciclo
  arcClock += dt;
  if(arcClock > CFG.arcLife){ arcClock = 0; regenArcs(); }
  arcMat.opacity = ((0.25 + boost*0.5) + 0.65*(1 - arcClock/CFG.arcLife)) * (0.45 + 0.55*near);
  updateSparks(dt);
  updateWaves(dt);
  strips.forEach((s,i)=>{
    s.rotation.y += dt*0.13*s.userData.dir;
    s.material.map.offset.x += dt*0.026*s.userData.dir;
    s.material.opacity = (i ? 0.26 : 0.42) * boot * (0.6 + 0.4*near);
  });

  if(spinning){
    coreGroup.rotation.y += dt*CFG.spinCore;
    coreGroup.rotation.x  = Math.sin(t*0.16)*0.10;
    cages.forEach((c,i)=>{ c.rotation.y += dt*CFG.spinCage*c.userData.dir;
      c.rotation.x += dt*CFG.spinCage*0.35*(i?1:-1); });
    rings.forEach(r=>{ const s=r.userData.spin;
      r.rotation.x+=dt*s.x; r.rotation.y+=dt*s.y; r.rotation.z+=dt*s.z; });
    dust.rotation.y += dt*CFG.spinDust; dust.rotation.x += dt*CFG.spinDust*0.4;
    constel.rotation.y += dt*0.04;
  }

  // rede neural: repulsão do cursor + mola de volta
  mw.set(target.x*2, -target.y*2, 0.5).unproject(camera).sub(camera.position).normalize();
  const world = camera.position.clone().add(mw.multiplyScalar(camera.position.length()));
  const cp = constel.geometry.attributes.position.array, n = CFG.constelPts;
  for(let i=0;i<n;i++){
    const ix=i*3;
    let dx=cp[ix]-world.x, dy=cp[ix+1]-world.y, dz=cp[ix+2]-world.z;
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
    if(d<CFG.repelRadius && mouse.x>-900){
      const f=(1-d/CFG.repelRadius)*CFG.repelForce;
      constelVel[ix]+=(dx/d)*f*dt; constelVel[ix+1]+=(dy/d)*f*dt; constelVel[ix+2]+=(dz/d)*f*dt;
    }
    constelVel[ix]   += (constelBase[ix]  -cp[ix]  )*2.2*dt;
    constelVel[ix+1] += (constelBase[ix+1]-cp[ix+1])*2.2*dt;
    constelVel[ix+2] += (constelBase[ix+2]-cp[ix+2])*2.2*dt;
    constelVel[ix]*=0.9; constelVel[ix+1]*=0.9; constelVel[ix+2]*=0.9;
    cp[ix]+=constelVel[ix]; cp[ix+1]+=constelVel[ix+1]; cp[ix+2]+=constelVel[ix+2];
  }
  constel.geometry.attributes.position.needsUpdate = true;
  if(frame % 2 === 0) updateLinks(t);   // O(n²): metade dos frames basta
  updateGlyphs(t);
  document.getElementById('links').textContent = String(linkCount).padStart(3,'0');

  // câmara: órbita amortecida + micro-parallax do cursor
  orb.yaw   += (orb.tYaw  -orb.yaw  )*0.08;
  orb.pitch += (orb.tPitch-orb.pitch)*0.08;
  orb.dist  += (orb.tDist -orb.dist )*0.07;
  cur.x += (target.x-cur.x)*0.045; cur.y += (target.y-cur.y)*0.045;
  const cp2 = Math.cos(orb.pitch);
  camera.position.set(
    Math.sin(orb.yaw)*cp2*orb.dist + cur.x*2.4*CFG.parallax,
    Math.sin(orb.pitch)*orb.dist  - cur.y*1.8*CFG.parallax,
    Math.cos(orb.yaw)*cp2*orb.dist);
  camera.lookAt(0,0,0);

  if(compPass) compPass.uniforms.uTime.value = t;

  // fps + degradação automática de qualidade
  fpsMeter.acc += dt; fpsMeter.n++;
  if(fpsMeter.acc > 1){
    const fps = Math.round(fpsMeter.n/fpsMeter.acc);
    document.getElementById('fps').textContent = String(fps);
    if(fps < 42 && fpsMeter.quality === 2){
      fpsMeter.quality = 1;
      renderer.setPixelRatio(1);
      resize();
    } else if(fps < 34 && fpsMeter.quality === 1){
      fpsMeter.quality = 0;
      CFG.linkDist = 1.9; CFG.arcCount = 3;
      dust.visible = false;
    }
    fpsMeter.acc = 0; fpsMeter.n = 0;
  }

  if(composer) composer.render(); else renderer.render(scene, camera);
}

function downloadSelf(){
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], {type:'text/html'}));
  a.download = 'jarvis-nucleo-v4.html';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

(function boot(tries){
  if(window.THREE && window.THREE.SimplexNoise){
    try{ init(); animate(); }
    catch(e){ const el=document.getElementById('err');
      el.style.display='block'; el.textContent='erro: '+e.message; console.error(e); }
  } else if(tries<90){ setTimeout(()=>boot(tries+1), 60); }
  else { document.getElementById('loading').textContent='falha ao carregar three.js'; }
})(0);
</script>
