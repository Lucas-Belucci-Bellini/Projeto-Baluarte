name: Security Contracts

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'v2-development'
    paths:
      - 'supabase/**'
      - 'test/security/**'
      - '.github/workflows/security-contracts.yml'
  pull_request:
    branches:
      - main
      - 'v2-development'
    paths:
      - 'supabase/**'
      - 'test/security/**'
      - '.github/workflows/security-contracts.yml'

permissions:
  contents: read

jobs:
  security-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security contract tests
        run: node --test test/security/supabase-contract.test.js
