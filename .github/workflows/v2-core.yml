name: V2 Core

on:
  push:
    branches:
      - main
      - release/v1.x
      - v2-development
      - v2-integration
      - 'claude/**'
    paths:
      - 'v2/core/**'
      - 'test/v2/**'
      - 'package.json'
      - 'v2/jsconfig.json'
      - '.github/workflows/v2-core.yml'
  pull_request:
    paths:
      - 'v2/core/**'
      - 'test/v2/**'
      - 'package.json'
      - 'v2/jsconfig.json'
      - '.github/workflows/v2-core.yml'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run tipos:v2
