# Análise de segurança CodeQL (issue #192) — o único template aplicável da
# lista: os de deploy (Azure/AWS/GKE…) não servem porque o site deploya na
# Vercel. Roda SÓ em push/PR no main (sem cron — sem agente em segundo plano).
# Resultados na aba Security → Code scanning do repositório.
#
# workflow_dispatch: os commits automáticos (câmbio) usam GITHUB_TOKEN e NÃO
# disparam workflows — a main fica sem análise e o check dos PRs seguintes
# compara contra nada, marcando alerta antigo como "novo". Se isso acontecer,
# rode manualmente na aba Actions (botão "Run workflow") pra re-criar a base.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analisar (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Iniciar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # vendor/ = código/textos de TERCEIROS (referência), fora do build/deploy
          # e fora do nosso código. Excluído do CodeQL pra não poluir os PRs.
          config: |
            paths-ignore:
              - vendor

      - name: Analisar
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
