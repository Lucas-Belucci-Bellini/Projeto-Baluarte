# Análise de segurança CodeQL (issue #192) — o único template aplicável da
# lista: os de deploy (Azure/AWS/GKE…) não servem porque o site deploya na
# Vercel. Roda SÓ em push/PR no main (sem cron — sem agente em segundo plano).
# Resultados na aba Security → Code scanning do repositório.
#
# workflow_dispatch: os commits automáticos (câmbio) usam GITHUB_TOKEN e NÃO
# disparam workflows — a main fica sem análise e o check dos PRs seguintes
# compara contra nada, marcando alerta antigo como "novo". Se isso acontecer,
# rode manualmente na aba Actions (botão "Run workflow") pra re-criar a base.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analisar (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Iniciar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # GitNexus 1.6.7 é código de TERCEIRO, commitado inteiro na raiz do
          # repo: 3.711 arquivos, dos quais 1.564 JS/TS. Analisá-lo produz
          # alerta que ninguém deste projeto pode corrigir (não é nosso código,
          # e atualizar significa trocar a pasta inteira), e some com a
          # sinalização do que É nosso: o PR #402 não toca um arquivo sequer
          # ali e mesmo assim herdou alerta, porque o diff grande fez o CodeQL
          # reatribuir. Ver o aviso do próprio GitHub no check: "Alerts not
          # introduced by this pull request might have been detected because
          # the code changes were too large."
          #
          # A análise continua cobrindo TODO o código que este projeto escreve:
          # src/, scripts/, api/, desktop/, backend/.
          #
          # ⚠️ O DIRETÓRIO NU É O QUE FUNCIONA. A primeira tentativa usou só
          # `GitNexus-1.6.7/**` e NÃO excluiu nada: o log do job seguiu
          # dizendo "CodeQL scanned 1551 out of 1551 TypeScript files" — e
          # este projeto não tem UM arquivo TypeScript, os 1.551 são todos
          # do GitNexus. O config era lido (aparece no user-config.yaml),
          # só não casava. As duas formas ficam declaradas.
          #
          # Como conferir se voltar a falhar: o log do job de
          # javascript-typescript termina com a linha "CodeQL scanned N out
          # of N TypeScript files". Neste repo o número certo é ZERO.
          config: |
            paths-ignore:
              - GitNexus-1.6.7
              - GitNexus-1.6.7/**
              - '**/GitNexus-1.6.7/**'

      - name: Analisar
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
