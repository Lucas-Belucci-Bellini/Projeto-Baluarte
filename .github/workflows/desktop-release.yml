name: Desktop Release

# Builda e publica os instaladores do Baluarte Launcher (Win/Mac/Linux). Dispara
# por tag `desktop-v*` OU manualmente (workflow_dispatch — botão "Run workflow",
# ou via API). Os artefatos vão pra Release e o electron-updater entrega a
# atualização aos apps já instalados.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (informativo; a versão real vem de desktop/package.json)'
        required: false
        default: '1.3.3'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build web (fallback embutido)
        run: |
          npm ci
          npm run build

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      # O binário do Runtime entra no instalador por `extraResources`
      # (desktop/package.json → ../v2/runtime/target/release). Sem este passo a
      # ORIGEM não existe — e `extraResources` com `filter` não falha quando a
      # origem falta, apenas não copia. A release sairia sem o Runtime, o app
      # degradaria educadamente (`runtime:status` → indisponível), e ninguém
      # notaria até alguém procurar o recurso.
      #
      # Cada SO da matriz compila o binário nativo dele; é por isso que o passo
      # mora aqui, e não num job único.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Runtime nativo (release)
        run: cargo build --release --manifest-path v2/runtime/Cargo.toml

      - name: Verify release version
        working-directory: desktop
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#desktop-v}"
          EXPECTED="${REQUESTED_VERSION:-$VERSION}"
          if [[ "$GITHUB_REF_NAME" == desktop-v* ]]; then EXPECTED="$TAG_VERSION"; fi
          test "$VERSION" = "$EXPECTED"
          test "$TAG_VERSION" = "$VERSION" || [[ "$GITHUB_REF_NAME" != desktop-v* ]]
          echo "Release version verified: $VERSION"

      - name: Build & publish installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
