name: V2 Specialist — JavaScript/JSDoc

on:
  pull_request:
    paths:
      - 'v2/core/**'
      - 'v2/modules/**'
      - 'v2/jsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - 'test/v2/**'
      - '.github/workflows/v2-js-specialist.yml'
  push:
    branches:
      - v2-development
      - v2-integration
      - 'v2/**'
      - 'claude/**'
    paths:
      - 'v2/core/**'
      - 'v2/modules/**'
      - 'v2/jsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - 'test/v2/**'
      - '.github/workflows/v2-js-specialist.yml'

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript / V2-JSDoc specialist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run tipos:v2
