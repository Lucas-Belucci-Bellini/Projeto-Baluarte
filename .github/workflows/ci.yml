# CI de build e das invariantes de dado do Arma 3.
#
# Por que existe: o repo tinha só CodeQL, câmbio e os releases — nenhum
# workflow conferia que o site COMPILA nem que os dados gerados continuam
# honestos. A regra do projeto é "merge quando o CI ficar verde"; sem isto,
# não havia verde para esperar.
#
# O `verificar-arma3` REGERA as bases a partir de scripts/arma3/out/ (o dump
# versionado) e só então roda os verificadores. Isso pega dois defeitos que
# passariam calados:
#
#   1. gerador e arquivo gerado fora de sincronia — alguém edita
#      src/data/arma3-*.js à mão e o próximo `git diff` acusa
#   2. link de wiki que promete o que não entrega (artigo apontando pra
#      arma/acessório/terreno que não existe, ou pra calculadora que cairia
#      em outra arma)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + invariantes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: npm ci

      # Auditoria de dependências (#420, item 🟠 8). Bloqueia só o que CHEGA no
      # navegador do operador: --omit=dev. A varredura de 09/08/2026 achou 6
      # avisos, todos em devDependency (postcss via vite, tar via @capacitor/cli)
      # — nenhum roda na máquina de quem visita o site.
      #
      # Reprovar merge por causa de aviso em build tool ensina a ignorar o
      # vermelho, e é assim que um aviso de produção passa despercebido depois.
      - name: Dependências de produção sem vulnerabilidade alta
        run: npm audit --omit=dev --audit-level=high

      # As de desenvolvimento ficam VISÍVEIS sem travar o merge.
      - name: Dependências de desenvolvimento (informativo)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      # O mapa da migração (docs/nexus/dominios.json) só vale enquanto for
      # verdade: rota nova em src/main.js sem dono declarado quebra aqui, em
      # vez de virar órfã no meio da extração dos 20 domínios (#406).
      - name: O mapa do Nexus bate com as rotas reais?
        run: npm run verificar-nexus

      # O orquestrador é o que recusa módulo torto ANTES de o sistema montar.
      # Se ele deixar passar rota duplicada ou ciclo, a falha aparece meia tela
      # depois, em runtime, sem dizer de quem é a culpa.
      - name: Testes
        run: npm test

      # Acrescentado depois de um erro concreto: um commit da V2 afirmou
      # "tsc exit=0" quando havia 3 erros de tipo. O comando estava encadeado de
      # um jeito que commitou com o verificador vermelho, e a saída lida foi a
      # errada. Verificação que depende de alguém ler direito não é verificação.
      #
      # Só o `v2/`: a V1 é JS puro e continua sendo (ver docs/v2/V2_STACK.md §2).
      # Este passo não pode quebrar nada da V1 — se o v2/ sumir, o tsc não acha
      # arquivo e sai zero.
      - name: Tipos da V2 (JSDoc + checkJs)
        run: npm run tipos:v2

      # A tabela de estabilidade do README é a PROMESSA PÚBLICA da 1.0.0 — "isto
      # aqui é estável". Promessa que mora em dois lugares diverge: alguém
      # promove uma flag no código, esquece o README, e a partir daí o README
      # mente para quem lê. Aqui a divergência aparece no PR.
      - name: A tabela de estabilidade bate com a política?
        run: npm run gen-tabela-estabilidade -- --verificar

      # Mesmo raciocínio, outro alvo: o catálogo de eventos responde "se eu
      # renomear este evento, quem para de funcionar?". A resposta é quem
      # escuta, e isso vive espalhado por 11 arquivos. Escrito à mão, o
      # catálogo mentiria no primeiro rename; gerado, o rename aparece aqui.
      - name: O catálogo de eventos bate com o código?
        run: node scripts/gen-catalogo-eventos.mjs --verificar

      # Este não só documenta: ele COBRA a invariante de que toda chave tocada
      # por src/ está declarada em politica.js. Chave sem esquema não tem versão
      # nem migração, e congelar a 1.0.0 assim deixaria a V2 sem contrato pra
      # ler o dado da V1 — com o agravante de que a perda é silenciosa
      # (storage.get devolve o fallback, sem erro). A varredura que introduziu
      # este passo achou 59 chaves nessa situação, entre elas cofres de chave
      # de API.
      - name: Toda chave de storage está declarada na política?
        run: npm run gen-catalogo-storage -- --verificar

      # Os .sqf sao COLADOS no debug console do jogo, que nao e UTF-8. Um
      # acento no arquivo corrompe o script antes de o parser existir, e o
      # erro no jogo nao fala nada sobre codificacao. Ja aconteceu: os seis
      # dumps novos sairam em UTF-8 e nenhum rodou.
      - name: Parsers do Arma 3 (formato + .sqf em ASCII puro)
        run: npm run testar-parsers-arma3

      # O nome do arquivo de icone saia do basename do caminho virtual, e
      # \fir_f14\icon.paa e \fir_f15\icon.paa tem o MESMO basename: o segundo
      # reaproveitava a imagem do primeiro em silencio. 310 imagens erradas,
      # 12 delas ja publicadas. Aqui a injetividade e cobrada.
      - name: Catalogo de imagens do Arma 3 (nome sem colisao)
        run: npm run testar-imagens-arma3

      # O atualizador decide sozinho o que refazer. O modo de falha que
      # importa e PULAR o que mudou: o operador roda o dump novo, o pipeline
      # acha que esta tudo em dia, e o site segue com dado velho sem aviso.
      - name: Pipeline do Arma 3 (sabe o que precisa refazer)
        run: npm run testar-pipeline-arma3

      # MLOD o Blender importa; ODOL nao tem leitor confiavel. Confundir os
      # dois custa caro: dizer que ODOL converte manda o operador montar o
      # Blender e colher milhares de falhas sem entender por que.
      - name: Modelos do Arma 3 (MLOD converte, ODOL nao)
        run: npm run testar-modelos-arma3

      - name: Regerar as bases e conferir as invariantes
        run: npm run verificar-arma3

      # Se a regeração mudou algum arquivo versionado, o commit está
      # desatualizado em relação ao gerador — falha declarando o quê.
      - name: As bases geradas batem com o commit?
        run: |
          if ! git diff --quiet -- src/data public/arma3; then
            echo "::error::As bases geradas divergem do commit. Rode 'npm run verificar-arma3' e commite o resultado."
            git diff --stat -- src/data public/arma3
            exit 1
          fi
          echo "ok — bases geradas em dia com o gerador."
