name: V2 Specialist — Rust Runtime

on:
  pull_request:
    paths:
      - 'v2/runtime/**'
      - '.github/workflows/v2-rust-specialist.yml'
  push:
    branches:
      - v2-development
      - v2-integration
      - 'v2/**'
      - 'claude/**'
    paths:
      - 'v2/runtime/**'
      - '.github/workflows/v2-rust-specialist.yml'

permissions:
  contents: read

jobs:
  rust:
    name: Rust Runtime specialist
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/runtime
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: rustup component add rustfmt --toolchain stable-x86_64-unknown-linux-gnu
      - run: cargo +stable fmt --check
      - run: cargo +stable test --all-targets
