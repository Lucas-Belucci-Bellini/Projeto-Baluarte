name: V2 Validation

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'v2-development'
      - 'v2-integration'
  pull_request:
    branches:
      - main
      - 'v2-development'
      - 'v2-integration'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # A instalação do Chromium com dependências do sistema pode passar de 15 min
    # em runners frios; o timeout maior evita cancelamento falso do gate.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck V2
        run: npm run tipos:v2

      # O portão abre um Chromium de verdade. O `npm ci` traz a biblioteca do
      # Playwright, não o navegador — sem este passo o `v2:integracao` morre
      # antes da primeira asserção. Ficou invisível porque o `Typecheck V2`
      # falhava antes e deixava este passo `skipped`.
      - name: Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: V2 integration
        run: npm run v2:integracao

      - name: JavaScript tests
        run: npm test

      - name: Vite build
        run: npm run build

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Runtime tests
        run: npm run v2:runtime
