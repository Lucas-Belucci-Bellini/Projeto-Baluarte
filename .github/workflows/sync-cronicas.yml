name: Sincronizar Crônicas (Google Docs)

# Mantém as Crônicas da Baluarte sempre em dia com os Google Docs (a fonte).
# Roda a cada 12 horas e também pode ser disparada manualmente. Se algum doc
# mudou, regenera os dados, commita no main e a Vercel republica sozinha.

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cronicas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sincronizar docs e regenerar dados
        run: |
          node scripts/sync-cronicas.mjs
          node scripts/gen-fanfic-from-docs.mjs
          node scripts/gen-elites-rosters.mjs
          node scripts/gen-dossie-from-doc.mjs

      - name: Commitar mudanças (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nas Crônicas — nada a fazer."
          else
            git commit -m "Sincroniza Crônicas a partir dos Google Docs [automático]"
            git push
          fi
