<!DOCTYPE html>
<html lang="pt-BR" data-theme="original">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⬡ Baluarte · Theme Switcher · 10 temas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap" rel="stylesheet" />

    html, body, #root {
      margin: 0; padding: 0;
      width: 100%; height: 100vh;
      overflow: hidden;
      background: var(--bg);

    body { font-family: var(--font-ui); color: var(--text); }

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <script type="text/babel" src="redesigns/home-data.jsx"></script>

  <!-- estrutura temável -->
  <script type="text/babel" src="switcher/home.jsx"></script>

  <!-- 30 temas (compartilhado com o canvas) -->
  <script type="text/babel" src="switcher/themes-list.jsx"></script>

  <script type="text/babel" src="switcher/app.jsx"></script>
