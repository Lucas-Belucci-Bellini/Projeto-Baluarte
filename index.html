<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0c16" />
    <meta name="description" content="Projeto Baluarte Mark XIII — plataforma narrativa, militar e de ferramentas técnicas." />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA instalável (#323 v0.4.0 · mobile Android/iOS) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Baluarte" />
    <meta name="application-name" content="Baluarte" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- CSS global do boot (#238 Fase 2 · CSS split): só a fundação, o shell,
         os componentes e as folhas compartilhadas por VÁRIAS páginas. As folhas
         específicas de uma página são importadas pelo próprio módulo da página
         (`import '../styles/x.css'`) e o Vite faz code-split por rota — então
         elas saem do caminho inicial e só baixam quando a rota é aberta. -->
    <link rel="stylesheet" href="/src/styles/reset.css" />
    <link rel="stylesheet" href="/src/styles/variables.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/atmosphere.css" />
    <link rel="stylesheet" href="/src/styles/immersive.css" />
    <link rel="stylesheet" href="/src/styles/animations.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <link rel="stylesheet" href="/src/styles/layout.css" />
    <link rel="stylesheet" href="/src/styles/overlay.css" />
    <link rel="stylesheet" href="/src/styles/theme-universos.css" />
    <link rel="stylesheet" href="/src/styles/reveal.css" />
    <link rel="stylesheet" href="/src/styles/effects.css" />
    <link rel="stylesheet" href="/src/styles/scroll-progress.css" />
    <link rel="stylesheet" href="/src/styles/home-v2.css" />

    <!-- folhas compartilhadas por múltiplas páginas (mantidas globais).
         Fatia 6 (#323): militar/terminal/portas/jarvis-vision/jarvis-dashboard/
         gerar-codigo saíram do boot — cada página dona importa a sua folha. -->
    <link rel="stylesheet" href="/src/styles/editor.css" />
    <link rel="stylesheet" href="/src/styles/calc.css" />
    <link rel="stylesheet" href="/src/styles/cripto.css" />
    <link rel="stylesheet" href="/src/styles/graficos.css" />
    <link rel="stylesheet" href="/src/styles/simbolos.css" />
    <link rel="stylesheet" href="/src/styles/arsenal.css" />
    <link rel="stylesheet" href="/src/styles/biblioteca.css" />
    <link rel="stylesheet" href="/src/styles/elites.css" />
    <link rel="stylesheet" href="/src/styles/logic-sim.css" />
    <link rel="stylesheet" href="/src/styles/morse.css" />
    <link rel="stylesheet" href="/src/styles/fase17.css" />
    <link rel="stylesheet" href="/src/styles/fase18.css" />
    <link rel="stylesheet" href="/src/styles/fase19.css" />

    <!-- seção IA (app-only via cockpit): as folhas saíram do boot (#323 v0.4.0
         fatia 5) — cada página importa a sua (`import '../styles/x.css'`) e o
         Vite faz code-split, então só baixam no app quando a aba abre. -->

    <title>⬡ Baluarte — Mark XIII</title>
  </head>
  <body>
    <div id="app" aria-live="polite">
      <div class="boot-screen" role="status" aria-label="Inicializando Baluarte">
        <div class="boot-screen__logo"><img src="/logo.svg" alt="Baluarte" /></div>
        <div class="boot-screen__title">PROJETO BALUARTE</div>
        <div class="boot-screen__subtitle">Mark XIII · Inicializando núcleo…</div>
        <div class="boot-screen__bar"><div class="boot-screen__bar-fill"></div></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
