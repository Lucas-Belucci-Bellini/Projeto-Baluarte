    <circle cx="7" cy="0" r="5"/><circle cx="172" cy="0" r="5"/><circle cx="337" cy="0" r="5"/>
    <path d="M24 0H150M189 0H315M354 0H465" stroke="#d4a24e" stroke-width="2" opacity="0.55"/>
