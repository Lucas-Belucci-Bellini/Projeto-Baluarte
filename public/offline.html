<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · Baluarte</title>
    <style>
      :root {
        color-scheme: dark;
        --cyan: #00f0ff;
        --magenta: #ff00aa;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at 50% 30%, #112233 0%, #0a0a0a 70%);
        color: #e6f1ff;
        font-family: 'Inter', system-ui, sans-serif;
        display: grid;
        place-items: center;
        text-align: center;
      }
      .wrap { padding: 32px; max-width: 480px; }
      .glyph {
        font-size: 96px;
        background: linear-gradient(135deg, var(--cyan), var(--magenta));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { letter-spacing: 0.08em; font-weight: 700; margin: 16px 0 8px; }
      p { color: #93a4bf; line-height: 1.6; }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border: 1px solid var(--cyan);
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 0.2em;
        color: var(--cyan);
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="glyph">⬡</div>
      <h1>SINAL PERDIDO</h1>
      <p>O Baluarte não conseguiu contato com o núcleo. Verifique sua conexão — tudo o que já foi carregado continua disponível.</p>
      <div class="badge">OFFLINE · MARK XIII</div>
    </div>
  </body>
</html>
