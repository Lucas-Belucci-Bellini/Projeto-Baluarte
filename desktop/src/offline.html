<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baluarte Launcher — offline</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background:
        radial-gradient(90% 70% at 72% 12%, rgba(0, 240, 255, 0.10), transparent 55%),
        radial-gradient(80% 70% at 14% 92%, rgba(255, 0, 170, 0.10), transparent 55%),
        #06080d;
      color: #e6f1ff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      text-align: center; padding: 24px;
    }
    .wrap { max-width: 460px; }
    h1 {
      font-size: 26px; letter-spacing: 2px; margin-bottom: 10px;
      background: linear-gradient(92deg, #e6f1ff, #00f0ff 60%, #ff00aa 110%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p { color: #9fb3c8; line-height: 1.6; font-size: 14px; }
    .seal img { height: 120px; width: auto; display: block; margin: 0 auto 20px;
      filter: drop-shadow(0 0 18px rgba(255, 31, 58, 0.5));
      animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(0.96); opacity: 0.82; } 50% { transform: scale(1.04); opacity: 1; } }
    button {
      margin-top: 22px; padding: 10px 22px; font-size: 14px; cursor: pointer;
      color: #06080d; font-weight: 700; border: 0; border-radius: 999px;
      background: linear-gradient(92deg, #00f0ff, #ff00aa);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="seal"><img src="logo.svg" alt="Baluarte" /></div>
    <h1>BALUARTE LAUNCHER</h1>
    <p>Sem conexão com o hub. Verifique sua internet — o launcher reconecta à
       produção automaticamente assim que a rede voltar.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
