# Blueprint do Render para o backend de IA do Baluarte (modo Servidor).
# Como usar:
#   1. Render > New > Blueprint > conecte este repositório.
#   2. Render lê este arquivo e cria o serviço "baluarte-ia-backend".
#   3. No serviço, defina a variável GEMINI_API_KEY (chave do Google AI Studio).
#   4. Após o deploy, copie a URL pública (https://baluarte-ia-backend.onrender.com)
#      e cole em: J.A.R.V.I.S. > ⚙ Modos & Config > modo Servidor > URL DO SERVIDOR.
services:
  - type: web
    name: baluarte-ia-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
